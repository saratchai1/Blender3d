<!doctype html>

<style>
:root{color-scheme:dark;--bg:#0a1017;--panel:#101923;--line:#26394c;--text:#eef4f8;--muted:#91a5b8;--accent:#6bc7ff}*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:13px system-ui}body{display:grid;grid-template-rows:64px 1fr}header{display:flex;align-items:center;gap:18px;padding:10px 16px;border-bottom:1px solid var(--line)}h1{margin:0;font-size:16px}.sub{color:var(--muted);font-size:11px}.stats{display:flex;gap:7px}.stat{padding:5px 9px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}.stat b{display:block;font-size:15px}.stat span{font-size:9px;color:var(--muted)}main{min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 370px}.viewer{position:relative;overflow:hidden;background:radial-gradient(circle at 50% 30%,#172b40,#0a1017 60%)}canvas{width:100%;height:100%;display:block}.poster{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#0a1017;z-index:2;transition:opacity .25s;pointer-events:none}.poster.hidden{opacity:0}.tools,.status{position:absolute;z-index:4}.tools{top:12px;left:12px;display:flex;gap:6px;flex-wrap:wrap}.status{left:12px;bottom:12px;padding:6px 9px;background:#101923dd;border:1px solid var(--line);border-radius:8px;color:var(--muted)}button{border:1px solid var(--line);background:#101923dd;color:var(--text);border-radius:8px;padding:6px 9px;cursor:pointer}button.on{border-color:var(--accent);background:#17354b}.side{min-height:0;border-left:1px solid var(--line);background:var(--panel);display:grid;grid-template-rows:auto auto 1fr auto}.search{padding:10px;border-bottom:1px solid var(--line)}input{width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;background:#081019;color:var(--text)}.chips{display:flex;gap:5px;flex-wrap:wrap;padding:8px;border-bottom:1px solid var(--line)}.chips button{padding:4px 7px;font-size:11px}.list{overflow:auto;padding:7px}.group{padding:8px 6px 4px;color:var(--muted);font-size:10px;text-transform:uppercase}.node{width:100%;display:grid;grid-template-columns:1fr auto;text-align:left;border:0;background:transparent;padding:7px}.node:hover,.node.sel{background:#1a3348}.node small{display:block;color:#71879b;font:9px monospace}.tag{font-size:9px;border:1px solid #365068;border-radius:99px;padding:2px 5px;align-self:center}.detail{max-height:34vh;overflow:auto;border-top:1px solid var(--line);padding:10px;background:#0c151e}.detail h3{margin:0}.raw{white-space:pre-wrap;font:9px monospace;color:#a5b5c4}@media(max-width:850px){.stats{display:none}main{grid-template-columns:1fr;grid-template-rows:56vh 500px}.side{border-left:0;border-top:1px solid var(--line)}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.179.1/examples/jsm/"}}</script>
</head>
<body>
<header><div><h1>House 200 sqm · Blender + Pascal</h1><div class="sub">Reviewed v3 · actual Blender GLB · Pascal semantic layer</div></div><div class="stats" id="stats"></div></header>
<main><section class="viewer"><img id="poster" class="poster" alt="Reviewed Blender render" src="https://raw.githubusercontent.com/saratchai1/Blender3d/main/web/house_200sqm/assets/house_200sqm_v3_preview.png"><canvas id="c"></canvas><div class="tools"><button id="fit">Fit</button><button id="render">Blender render</button><button id="rooms">Rooms</button><button data-floor="all" class="on">All</button><button data-floor="ground">Ground</button><button data-floor="upper">Upper</button></div><div class="status" id="status">Loading reviewed Blender v3…</div></section><aside class="side"><div class="search"><input id="q" placeholder="Search room, wall, door, window, ID…"></div><div class="chips" id="chips"></div><div class="list" id="list"></div><div class="detail" id="detail"><span class="sub">Select a semantic node or click the 3D model.</span></div></aside></main>
<script type="module">
import * as THREE from 'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';import{GLTFLoader}from'three/addons/loaders/GLTFLoader.js';
const BASE='https://raw.githubusercontent.com/saratchai1/Blender3d/main/web/house_200sqm/assets/';const data=await fetch(BASE+'house_200sqm.pascal.json',{cache:'no-cache'}).then(r=>{if(!r.ok)throw Error('Pascal '+r.status);return r.json()});const nodes=data.nodes||{},A=Object.values(nodes),counts={};A.forEach(n=>counts[n.type]=(counts[n.type]||0)+1);const building=A.find(n=>n.type==='building')||{};stats.innerHTML=[[building.metadata?.gross_floor_area_sqm||200,'sqm'],[counts.level||0,'floors'],[counts.zone||0,'rooms'],[counts.wall||0,'walls'],[counts.door||0,'doors'],[counts.window||0,'windows']].map(x=>`<div class="stat"><b>${x[0]}</b><span>${x[1]}</span></div>`).join('');
const R=new THREE.WebGLRenderer({canvas:c,antialias:true,alpha:true});R.setPixelRatio(Math.min(devicePixelRatio,2));R.outputColorSpace=THREE.SRGBColorSpace;const S=new THREE.Scene,cam=new THREE.PerspectiveCamera(48,1,.05,200),ctl=new OrbitControls(cam,c);ctl.enableDamping=true;S.add(new THREE.HemisphereLight(0xe7f2ff,0x1d2a1f,2.4));const sun=new THREE.DirectionalLight(0xffffff,2.7);sun.position.set(8,15,10);S.add(sun);const grid=new THREE.GridHelper(24,24,0x334455,0x1f2b36);grid.position.set(5,-.05,-5);S.add(grid);const root=new THREE.Group,zoneGroup=new THREE.Group;S.add(root,zoneGroup);let model=null,sel='',type='all',floor='all',showRooms=false;const baseMat=new Map,hi=new THREE.MeshStandardMaterial({color:0xffd166,emissive:0x7a4d00,emissiveIntensity:.7,roughness:.55}),zoneMat=new THREE.MeshBasicMaterial({color:0x4aa8ff,transparent:true,opacity:.13,side:THREE.DoubleSide,depthWrite:false}),zoneHi=new THREE.MeshBasicMaterial({color:0xffd166,transparent:true,opacity:.34,side:THREE.DoubleSide,depthWrite:false});
function levelY(n){const p=nodes[n.parentId];if(n.type==='level')return(n.level||0)*3.2;if(p?.type==='level')return(p.level||0)*3.2;if(p?.parentId&&nodes[p.parentId]?.type==='level')return(nodes[p.parentId].level||0)*3.2;return 0}A.filter(n=>n.type==='zone'&&Array.isArray(n.polygon)).forEach(n=>{const sh=new THREE.Shape;n.polygon.forEach((p,i)=>i?sh.lineTo(p[0],-p[1]):sh.moveTo(p[0],-p[1]));sh.closePath();const m=new THREE.Mesh(new THREE.ShapeGeometry(sh),zoneMat);m.geometry.rotateX(-Math.PI/2);m.position.y=levelY(n)+.11;m.userData.pascalId=n.id;zoneGroup.add(m)});zoneGroup.visible=false;
function idMatch(name,id){return name===id||name.startsWith(id+'_')||name.startsWith(id+'.')}function semantic(o){for(let x=o;x;x=x.parent){const e=x.userData?.derived_from_pascal_id||x.userData?.pascal_id||x.userData?.pascalId;if(e&&nodes[e])return e;for(const n of A)if(idMatch(x.name||'',n.id))return n.id}return null}function houseBox(){const b=new THREE.Box3;if(!model)return b;model.traverse(o=>{if(!o.isMesh)return;const n=(o.name||'').toLowerCase();if(n.startsWith('site_')||n.startsWith('plant_'))return;b.union(new THREE.Box3().setFromObject(o))});return b}function focus(b){if(!b||b.isEmpty())return;const z=new THREE.Vector3,cc=new THREE.Vector3;b.getSize(z);b.getCenter(cc);const d=Math.max(z.x,z.y,z.z,1)/(2*Math.tan(THREE.MathUtils.degToRad(cam.fov/2)))*1.45;cam.position.copy(cc).add(new THREE.Vector3(d*.75,d*.55,d));ctl.target.copy(cc);ctl.update()}fit.onclick=()=>focus(houseBox());
new GLTFLoader().load(BASE+'house_200sqm_v3.glb',g=>{model=g.scene;root.add(model);model.traverse(o=>{if(o.isMesh)baseMat.set(o.uuid,o.material)});focus(houseBox());poster.classList.add('hidden');status.textContent=`Blender v3 loaded · ${A.length} Pascal nodes`},e=>{},e=>{console.error(e);status.textContent='3D load failed · showing reviewed Blender render'});
function reset(){if(model)model.traverse(o=>{if(o.isMesh&&baseMat.has(o.uuid))o.material=baseMat.get(o.uuid)});zoneGroup.children.forEach(o=>o.material=zoneMat)}function choose(id){sel=id;reset();const n=nodes[id];if(!n)return;const matched=[];if(model)model.traverse(o=>{if(o.isMesh&&(idMatch(o.name||'',id)||semantic(o)===id)){o.material=hi;matched.push(o)}});zoneGroup.children.forEach(o=>{if(o.userData.pascalId===id){o.material=zoneHi;matched.push(o)}});if(matched.length){const b=new THREE.Box3;matched.forEach(o=>b.union(new THREE.Box3().setFromObject(o)));focus(b)}renderList();detail.innerHTML=`<h3>${esc(n.name||n.id)}</h3><small>${esc(n.id)}</small><div class="raw">${esc(JSON.stringify(n,null,2))}</div>`;status.textContent=`Selected ${n.name||id} · ${n.type} · ${matched.length} 3D part(s)`}function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const types=['all','zone','wall','door','window','slab','ceiling','roof-segment'];chips.innerHTML=types.filter(t=>t==='all'||counts[t]).map(t=>`<button data-type="${t}" class="${t==='all'?'on':''}">${t==='zone'?'rooms':t}${t==='all'?'':` ${counts[t]}`}</button>`).join('');chips.onclick=e=>{const b=e.target.closest('[data-type]');if(!b)return;type=b.dataset.type;[...chips.children].forEach(x=>x.classList.toggle('on',x===b));renderList()};q.oninput=renderList;function nodeFloor(n){return levelY(n)>=3?'upper':'ground'}function renderList(){const s=q.value.toLowerCase(),arr=A.filter(n=>(type==='all'||n.type===type)&&(!s||`${n.id} ${n.name||''} ${n.type}`.toLowerCase().includes(s)));list.innerHTML=['ground','upper'].map(f=>{const x=arr.filter(n=>nodeFloor(n)===f);return x.length?`<div class="group">${f} · ${x.length}</div>`+x.map(n=>`<button class="node ${sel===n.id?'sel':''}" data-id="${n.id}"><span>${esc(n.name||n.id)}<small>${esc(n.id)}</small></span><span class="tag">${esc(n.type)}</span></button>`).join(''):''}).join('')}list.onclick=e=>{const b=e.target.closest('[data-id]');if(b)choose(b.dataset.id)};renderList();
function applyFloor(){if(model)model.traverse(o=>{if(!o.isMesh)return;const y=new THREE.Box3().setFromObject(o).getCenter(new THREE.Vector3).y;o.visible=floor==='all'||(floor==='ground'&&y<3.25)||(floor==='upper'&&y>=3)});zoneGroup.children.forEach(o=>{const n=nodes[o.userData.pascalId];o.visible=showRooms&&(floor==='all'||nodeFloor(n)===floor)})}document.querySelectorAll('[data-floor]').forEach(b=>b.onclick=()=>{floor=b.dataset.floor;document.querySelectorAll('[data-floor]').forEach(x=>x.classList.toggle('on',x===b));applyFloor();focus(houseBox())});rooms.onclick=e=>{showRooms=!showRooms;zoneGroup.visible=showRooms;e.currentTarget.classList.toggle('on',showRooms);applyFloor()};render.onclick=e=>{poster.classList.toggle('hidden');e.currentTarget.classList.toggle('on',!poster.classList.contains('hidden'))};
const ray=new THREE.Raycaster,p=new THREE.Vector2;c.onclick=e=>{if(!model||!poster.classList.contains('hidden'))return;const r=c.getBoundingClientRect();p.x=(e.clientX-r.left)/r.width*2-1;p.y=-(e.clientY-r.top)/r.height*2+1;ray.setFromCamera(p,cam);const h=ray.intersectObject(model,true).find(x=>x.object.visible);if(h){const id=semantic(h.object);if(id)choose(id)}};function resize(){const z=c.parentElement.getBoundingClientRect();R.setSize(z.width,z.height,false);cam.aspect=z.width/z.height;cam.updateProjectionMatrix()}new ResizeObserver(resize).observe(c.parentElement);resize();!function loop(){requestAnimationFrame(loop);ctl.update();R.render(S,cam)}();
</script></body></html>
