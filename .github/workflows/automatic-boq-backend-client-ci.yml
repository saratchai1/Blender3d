name: Automatic BOQ Hybrid Backend Client CI

on:
  push:
    branches:
      - feat/auto-boq-backend-client
    paths:
      - 'web/opentakeoff-poc/browser-auto-boq-hybrid*'
      - 'web/opentakeoff-poc/browser-backend-runtime*'
      - 'integrations/opentakeoff/install_browser_runtime.py'
      - '.github/workflows/automatic-boq-backend-client-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hybrid-client:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: integrations/opentakeoff/requirements-auto-boq.txt
      - name: Test backend client contract
        run: node --test web/opentakeoff-poc/browser-auto-boq-hybrid.test.mjs
      - name: Install Automatic BOQ dependencies
        run: python -m pip install --disable-pip-version-check -r integrations/opentakeoff/requirements-auto-boq.txt
      - name: Fetch exact pinned OpenTakeoff upstream
        uses: actions/checkout@v4
        with:
          repository: Kentucky-ai/opentakeoff
          ref: 7a3c8eb44252d0d9083157ad9677866f92f711bb
          path: .external/opentakeoff-poc
          persist-credentials: false
      - name: Fetch verified Family4 PDF
        run: python integrations/opentakeoff/fetch_sample.py --output .generated/samples/family4.pdf
      - name: Build v8.19 POC
        run: python integrations/opentakeoff/build.py --upstream .external/opentakeoff-poc --output .generated/pages/takeoff --demo-pdf .generated/samples/family4.pdf
      - name: Install hybrid runtime
        run: python integrations/opentakeoff/install_browser_runtime.py --upstream .external/opentakeoff-poc --output .generated/pages/takeoff
      - name: Assert hybrid package and demo isolation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('.generated/pages/takeoff')
          info=json.loads((root/'browser-runtime-info.json').read_text())
          auto=json.loads((root/'auto-boq.json').read_text())
          pipe=[r for r in auto['rows'] if str(r.get('id','')).startswith('SAN-PIPE-')]
          assert info['runtime']=='browser-auto-boq-hybrid.mjs',info
          assert info['reference_data_dependency'] is False,info
          assert "import('./browser-auto-boq-hybrid.mjs')" in (root/'poc.js').read_text()
          assert len(auto['rows'])==27
          assert len(pipe)==8
          assert abs(sum(float(r['quantity']) for r in pipe)-92.5)<1e-6
          assert auto['source_policy']['reference_used_for_generation'] is False
          print('HYBRID_RUNTIME_PACKAGE_PASS', {'rows':27,'pipe_total_m':92.5})
          PY
      - name: Install Chromium QA runtime
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Run browser fallback QA with no backend configured
        run: python web/opentakeoff-poc/runtime_smoke.py --root .generated/pages --out .generated/hybrid-runtime-qa
      - name: Retain evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automatic-boq-hybrid-backend-client
          path: |
            .generated/pages/takeoff/
            .generated/hybrid-runtime-qa/
          if-no-files-found: warn
          retention-days: 30
