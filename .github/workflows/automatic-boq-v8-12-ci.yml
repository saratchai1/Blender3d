name: Automatic BOQ v8.12 vertical probe CI

on:
  push:
    branches:
      - feat/auto-boq-v8-pipe-network
    paths:
      - 'integrations/opentakeoff/auto_boq_v8_12.py'
      - 'integrations/opentakeoff/vertical_schematic_v8.py'
      - 'integrations/opentakeoff/test_vertical_schematic_v8.py'
      - 'integrations/opentakeoff/auto_boq_v8_11.py'
      - 'integrations/opentakeoff/cross_view_system_consensus_v8.py'
      - 'integrations/opentakeoff/auto_boq_v8_10.py'
      - 'integrations/opentakeoff/rainwater_page_evidence_v8.py'
      - 'integrations/opentakeoff/auto_boq_v8_9.py'
      - 'integrations/opentakeoff/dashed_network_partition_v8.py'
      - 'integrations/opentakeoff/collinear_gap_bridge_v8.py'
      - 'integrations/opentakeoff/auto_boq_v8_7.py'
      - 'integrations/opentakeoff/auto_boq_v8_6.py'
      - 'integrations/opentakeoff/detail_short_branch_v8.py'
      - 'integrations/opentakeoff/strict_pipe_tags_v8.py'
      - 'integrations/opentakeoff/layer_topology_v8.py'
      - 'integrations/opentakeoff/auto_boq_v8_3.py'
      - 'integrations/opentakeoff/detail_view_transfer_v8.py'
      - 'integrations/opentakeoff/leader_association_v8.py'
      - 'integrations/opentakeoff/profiles/family4.json'
      - 'integrations/opentakeoff/fetch_sample.py'
      - 'integrations/opentakeoff/requirements-auto-boq.txt'
      - '.github/workflows/automatic-boq-v8-12-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  family4-v8-12:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: integrations/opentakeoff/requirements-auto-boq.txt
      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check -r integrations/opentakeoff/requirements-auto-boq.txt
      - name: Run vertical and upstream regressions
        working-directory: integrations/opentakeoff
        run: |
          python test_vertical_schematic_v8.py
          python test_cross_view_system_consensus_v8.py
          python test_rainwater_page_evidence_v8.py
          python test_dashed_network_partition_v8.py
          python test_strict_pipe_tags_v8.py
      - name: Fetch exact Family4 source PDF
        run: python integrations/opentakeoff/fetch_sample.py --output .generated/samples/family4.pdf
      - name: Generate v8.11 control
        run: >-
          python integrations/opentakeoff/auto_boq_v8_11.py
          --pdf .generated/samples/family4.pdf
          --profile integrations/opentakeoff/profiles/family4.json
          --output .generated/v8-11-control.json
      - name: Generate v8.12 vertical reconstruction diagnostic
        run: >-
          python integrations/opentakeoff/auto_boq_v8_12.py
          --pdf .generated/samples/family4.pdf
          --profile integrations/opentakeoff/profiles/family4.json
          --output .generated/v8-12.json
      - name: Assert calibrated vertical probe remains non-publishing
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('.generated/v8-11-control.json').read_text())
          n=json.loads(Path('.generated/v8-12.json').read_text())
          assert c['source_policy']['reference_used_for_generation'] is False
          assert n['source_policy']['reference_used_for_generation'] is False
          assert len(c['rows'])==len(n['rows'])==19
          assert not any(str(r.get('id','')).startswith('SAN-PIPE-') for r in n['rows'])
          dc=next(d for d in c['diagnostics'] if d.get('detector')=='sanitary_pipe_network_v8_11')
          dn=next(d for d in n['diagnostics'] if d.get('detector')=='sanitary_pipe_network_v8_12')
          assert dc['reconciliation']['horizontal_diameter_gate']=='PASS', dc['reconciliation']
          assert dn['reconciliation']['horizontal_diameter_gate']=='PASS', dn['reconciliation']
          probe=dn['vertical_schematic_reconstruction']; axis=probe['elevation_axis']
          assert probe['status']=='DIAGNOSTIC_VERTICAL_RECONSTRUCTION_ONLY', probe
          assert probe['publication_policy']=='EVIDENCE_ONLY_NO_VERTICAL_QUANTITY_YET', probe
          assert axis['status']=='CALIBRATED_FROM_EXPLICIT_LEVEL_MARKERS', axis
          assert axis['marker_count']>=3, axis
          values={round(float(m['elevation_m']),2) for m in axis['markers']}
          assert {0.00,0.60,3.75}.issubset(values), values
          assert axis['r2']>=0.98 and axis['max_residual_m']<=0.20, axis
          assert probe['major_vertical_run_count']>=2, probe
          assert all(float(r['vertical_span_m'])>=2.0 for r in probe['major_vertical_runs'])
          assert dn['reconciliation']['full_pipe_boq_publication_status']=='WITHHELD_VERTICAL_AND_DETAIL_RECONCILIATION'
          print('AUTO_BOQ_V8_12_VERTICAL_PROBE_PASS',{
              'levels':sorted(values),
              'axis_r2':axis['r2'],
              'major_runs':probe['major_vertical_run_count'],
              'horizontal_gate':'PASS',
              'vertical_published':False,
          })
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: automatic-boq-v8-12-evidence
          path: |
            .generated/v8-11-control.json
            .generated/v8-12.json
          if-no-files-found: warn
          retention-days: 30
