name: Automatic BOQ leader probe

on:
  push:
    branches:
      - feat/auto-boq-v8-pipe-network
    paths:
      - 'integrations/opentakeoff/leader_association_v8.py'
      - 'integrations/opentakeoff/probe_tag_leaders_v8.py'
      - 'integrations/opentakeoff/test_leader_association_v8.py'
      - 'integrations/opentakeoff/auto_boq_v8_1.py'
      - 'integrations/opentakeoff/profiles/family4.json'
      - '.github/workflows/automatic-boq-leader-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  family4-leader-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: integrations/opentakeoff/requirements-auto-boq.txt
      - name: Install pinned PDF geometry dependencies
        run: python -m pip install --disable-pip-version-check -r integrations/opentakeoff/requirements-auto-boq.txt
      - name: Run leader resolver synthetic regression
        working-directory: integrations/opentakeoff
        run: python test_leader_association_v8.py
      - name: Fetch verified Family4 benchmark PDF
        run: python integrations/opentakeoff/fetch_sample.py --output .generated/samples/family4.pdf
      - name: Probe Family4 leader associations without changing BOQ
        run: >-
          python integrations/opentakeoff/probe_tag_leaders_v8.py
          --pdf .generated/samples/family4.pdf
          --profile integrations/opentakeoff/profiles/family4.json
          --output .generated/leader-probe-v8.json
      - name: Assert probe remains diagnostic-only
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result=json.loads(Path('.generated/leader-probe-v8.json').read_text())
          assert result['status']=='DIAGNOSTIC_ONLY_NO_QUANTITY_CHANGE'
          pages=result['pages']
          assert [p['sheet'] for p in pages]==['SN-04','SN-05','SN-06','SN-07']
          assert sum(p['tag_count'] for p in pages) > 0
          print('LEADER_PROBE_FAMILY4_PASS', {
              p['sheet']:{'associated':p['leader_associated'],'changes':p['leader_changes'],'recovers':p['leader_recovers']}
              for p in pages
          })
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: automatic-boq-v8-leader-probe
          path: .generated/leader-probe-v8.json
          if-no-files-found: warn
          retention-days: 30
