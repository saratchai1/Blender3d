name: Automatic BOQ User PDF Runtime Alpha CI

on:
  push:
    branches:
      - feat/auto-boq-user-runtime-alpha
      - feat/auto-boq-user-pipe-geometry-alpha
    paths:
      - 'web/opentakeoff-poc/**'
      - 'integrations/opentakeoff/**'
      - '.github/workflows/automatic-boq-user-runtime-alpha-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: automatic-boq-user-runtime-alpha-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-runtime-alpha:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: integrations/opentakeoff/requirements-auto-boq.txt
      - name: Install Automatic BOQ dependencies
        run: python -m pip install --disable-pip-version-check -r integrations/opentakeoff/requirements-auto-boq.txt
      - name: Fetch exact pinned OpenTakeoff upstream
        uses: actions/checkout@v4
        with:
          repository: Kentucky-ai/opentakeoff
          ref: 7a3c8eb44252d0d9083157ad9677866f92f711bb
          path: .external/opentakeoff-poc
          persist-credentials: false
      - name: Fetch verified Family4 PDF
        run: python integrations/opentakeoff/fetch_sample.py --output .generated/samples/family4.pdf
      - name: Test fail-closed browser parser and pipe geometry core
        run: node --test web/opentakeoff-poc/browser-auto-boq.test.mjs web/opentakeoff-poc/browser-pipe-geometry.test.mjs
      - name: Build v8.19 OpenTakeoff POC
        run: >-
          python integrations/opentakeoff/build.py
          --upstream .external/opentakeoff-poc
          --output .generated/pages/takeoff
          --demo-pdf .generated/samples/family4.pdf
      - name: Install pinned PDF.js user runtime
        run: >-
          python integrations/opentakeoff/install_browser_runtime.py
          --upstream .external/opentakeoff-poc
          --output .generated/pages/takeoff
      - name: Assert runtime assets and v8.19 demo remain isolated
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('.generated/pages/takeoff')
          info=json.loads((root/'browser-runtime-info.json').read_text())
          auto=json.loads((root/'auto-boq.json').read_text())
          pipe=[r for r in auto['rows'] if str(r.get('id','')).startswith('SAN-PIPE-')]
          assert info['network_dependency'] is False,info
          assert info['reference_data_dependency'] is False,info
          assert info['pdfjs_version'].startswith('4.10.'),info
          assert (root/'browser-auto-boq.mjs').is_file()
          assert (root/'vendor/pdf.mjs').is_file()
          assert (root/'vendor/pdf.worker.mjs').is_file()
          assert len(auto['rows'])==27,len(auto['rows'])
          assert len(pipe)==8,len(pipe)
          assert abs(sum(float(r['quantity']) for r in pipe)-92.5)<1e-6,pipe
          assert auto['source_policy']['reference_used_for_generation'] is False
          print('USER_RUNTIME_BUILD_ASSETS_PASS',{'pdfjs':info['pdfjs_version'],'demo_rows':27,'pipe_total_m':92.5})
          PY
      - name: Install Chromium QA runtime
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Run full demo plus user-runtime browser QA
        run: python web/opentakeoff-poc/smoke.py --root .generated/pages --out .generated/takeoff-qa
      - name: Run focused user PDF runtime QA
        run: python web/opentakeoff-poc/runtime_smoke.py --root .generated/pages --out .generated/user-runtime-qa
      - name: Retain runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automatic-boq-user-runtime-alpha
          path: |
            .generated/pages/takeoff/
            .generated/takeoff-qa/
            .generated/user-runtime-qa/
          if-no-files-found: warn
          retention-days: 30
