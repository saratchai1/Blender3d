name: Automatic BOQ v8.10 rainwater CI

on:
  push:
    branches:
      - feat/auto-boq-v8-pipe-network
    paths:
      - 'integrations/opentakeoff/auto_boq_v8_10.py'
      - 'integrations/opentakeoff/rainwater_page_evidence_v8.py'
      - 'integrations/opentakeoff/test_rainwater_page_evidence_v8.py'
      - 'integrations/opentakeoff/auto_boq_v8_9.py'
      - 'integrations/opentakeoff/dashed_network_partition_v8.py'
      - 'integrations/opentakeoff/collinear_gap_bridge_v8.py'
      - 'integrations/opentakeoff/auto_boq_v8_7.py'
      - 'integrations/opentakeoff/auto_boq_v8_6.py'
      - 'integrations/opentakeoff/detail_short_branch_v8.py'
      - 'integrations/opentakeoff/strict_pipe_tags_v8.py'
      - 'integrations/opentakeoff/layer_topology_v8.py'
      - 'integrations/opentakeoff/auto_boq_v8_3.py'
      - 'integrations/opentakeoff/detail_view_transfer_v8.py'
      - 'integrations/opentakeoff/leader_association_v8.py'
      - 'integrations/opentakeoff/profiles/family4.json'
      - 'integrations/opentakeoff/fetch_sample.py'
      - 'integrations/opentakeoff/requirements-auto-boq.txt'
      - '.github/workflows/automatic-boq-v8-10-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  family4-v8-10:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: integrations/opentakeoff/requirements-auto-boq.txt
      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check -r integrations/opentakeoff/requirements-auto-boq.txt
      - name: Run rainwater and upstream regressions
        working-directory: integrations/opentakeoff
        run: |
          python test_rainwater_page_evidence_v8.py
          python test_dashed_network_partition_v8.py
          python test_detail_short_branch_v8.py
          python test_strict_pipe_tags_v8.py
      - name: Fetch exact Family4 source PDF
        run: python integrations/opentakeoff/fetch_sample.py --output .generated/samples/family4.pdf
      - name: Generate v8.9 control
        run: >-
          python integrations/opentakeoff/auto_boq_v8_9.py
          --pdf .generated/samples/family4.pdf
          --profile integrations/opentakeoff/profiles/family4.json
          --output .generated/v8-9-control.json
      - name: Generate v8.10 rainwater diagnostic
        run: >-
          python integrations/opentakeoff/auto_boq_v8_10.py
          --pdf .generated/samples/family4.pdf
          --profile integrations/opentakeoff/profiles/family4.json
          --output .generated/v8-10.json
      - name: Assert corroboration and no publication regression
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('.generated/v8-9-control.json').read_text()); n=json.loads(Path('.generated/v8-10.json').read_text())
          assert c['source_policy']['reference_used_for_generation'] is False and n['source_policy']['reference_used_for_generation'] is False
          assert len(c['rows'])==len(n['rows'])==19
          assert not any(str(r.get('id','')).startswith('SAN-PIPE-') for r in n['rows'])
          dc=next(d for d in c['diagnostics'] if d.get('detector')=='sanitary_pipe_network_v8_9'); dn=next(d for d in n['diagnostics'] if d.get('detector')=='sanitary_pipe_network_v8_10')
          cp={p['sheet']:p['diameter_coverage']['assigned_fraction'] for p in dc['pages'] if p.get('contribution_policy')=='PRIMARY_PLAN_HORIZONTAL'}
          np={p['sheet']:p['diameter_coverage']['assigned_fraction'] for p in dn['pages'] if p.get('contribution_policy')=='PRIMARY_PLAN_HORIZONTAL'}
          assert all(np[k]>=cp[k] for k in cp),(cp,np)
          summary={x['sheet']:x for x in dn['rainwater_corroboration_summary']}
          assert summary['SN-06']['evidence_status']=='CORROBORATED_RL_DIAMETER',summary
          assert summary['SN-06']['diameter_key']=='DN65',summary
          assert summary['SN-06']['seeded_segment_count']>=1,summary
          assert summary['SN-06']['seeded_length_pt']>0,summary
          assert np['SN-06']>cp['SN-06'],(cp,np)
          sn6=next(p for p in dn['pages'] if p.get('sheet')=='SN-06')
          seeded=[r for r in sn6['diameter_assignments'] if r.get('diameter_evidence_role')=='PAGE_STANDALONE_RL_PLUS_RFD_RL']
          assert seeded and all(r['layer']=='RL' and r['classes'][0]['diameter_key']=='DN65' for r in seeded),seeded
          assert dn['reconciliation']['cross_view_policy_status']=='PASS_NON_ADDITIVE_BY_VIEW_ROLE'
          assert dn['reconciliation']['full_pipe_boq_publication_status'].startswith('WITHHELD_')
          print('AUTO_BOQ_V8_10_AB_PASS',{'control':cp,'rainwater':np,'sn06_rl_seeded_pt':summary['SN-06']['seeded_length_pt'],'pipe_rows':0})
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: automatic-boq-v8-10-evidence
          path: |
            .generated/v8-9-control.json
            .generated/v8-10.json
          if-no-files-found: warn
          retention-days: 30
