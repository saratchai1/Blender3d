name: Automatic BOQ CW valve leader probe

on:
  push:
    branches:
      - feat/auto-boq-v8-pipe-network
    paths:
      - 'integrations/opentakeoff/probe_cw_valve_leaders_v8.py'
      - 'integrations/opentakeoff/leader_association_v8.py'
      - 'integrations/opentakeoff/layer_topology_v8.py'
      - 'integrations/opentakeoff/profiles/family4.json'
      - 'integrations/opentakeoff/fetch_sample.py'
      - 'integrations/opentakeoff/requirements-auto-boq.txt'
      - '.github/workflows/automatic-boq-cw-valve-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  family4-cw-valve-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: integrations/opentakeoff/requirements-auto-boq.txt
      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check -r integrations/opentakeoff/requirements-auto-boq.txt
      - name: Fetch exact Family4 source PDF
        run: python integrations/opentakeoff/fetch_sample.py --output .generated/samples/family4.pdf
      - name: Probe BALL/FLOAT valve leaders to CW layer
        run: >-
          python integrations/opentakeoff/probe_cw_valve_leaders_v8.py
          --pdf .generated/samples/family4.pdf
          --profile integrations/opentakeoff/profiles/family4.json
          --output .generated/cw-valve-leader-probe.json
      - name: Assert source-only valve evidence contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('.generated/cw-valve-leader-probe.json').read_text())
          assert d['status']=='DIAGNOSTIC_ONLY_NO_QUANTITY_CHANGE'
          assert d['source_page']==57 and d['source_page']<=d['source_page_max']==71
          assert d['publication_policy']=='EVIDENCE_ONLY_NO_PIPE_LENGTH_ADDITION'
          names={r['name'] for r in d['callouts']}
          assert {'BALL VALVE','FLOAT VALVE'} <= names,names
          for row in d['callouts']:
              dia=row.get('diameter') or {}
              assert dia.get('diameter_key')=='DN15',row
          print('CW_VALVE_LEADER_SOURCE_PASS',{'callouts':d['callout_count'],'associated':d['associated_count']})
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: automatic-boq-cw-valve-leader-probe
          path: .generated/cw-valve-leader-probe.json
          if-no-files-found: warn
          retention-days: 30
