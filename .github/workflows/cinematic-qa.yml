name: Cinematic 3D QA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['web/office_10000sqm/cinematic/**', '.github/workflows/cinematic-qa.yml']
permissions:
  contents: read
concurrency:
  group: cinematic-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cinematic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build same-origin film and preserve original model
        run: |
          node --test web/office_10000sqm/tools/model.test.mjs
          node web/office_10000sqm/tools/build-pages.mjs
          node web/office_10000sqm/cinematic/build.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser review runtime
        run: |
          pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Verify real animated cameras, lighting, six shots and mobile WebGL
        run: python web/office_10000sqm/cinematic/smoke.py --root .generated/pages
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cinematic-3d-review
          path: |
            .generated/cinematic-qa/
            .generated/pages/cinematic/
          include-hidden-files: true
          retention-days: 14
