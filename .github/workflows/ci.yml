name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Sync pinned environment
        run: uv sync

      - name: Compile Python sources
        run: uv run python -m compileall -q src blender models

      - name: Verify runtime patch registration
        run: |
          uv run python - <<'PY'
          from blender3d_control.compat import KIRI_RELEASE_URL, apply_compatibility_patches
          from blender_mcp.handlers import addon_handler

          apply_compatibility_patches()
          assert addon_handler.KNOWN_ADDONS["gaussian_splat"][0] == KIRI_RELEASE_URL
          assert addon_handler.KNOWN_ADDONS["3dgs_blender"][0] == KIRI_RELEASE_URL
          assert addon_handler.KNOWN_ADDONS["kiri_3dgs"][0] == KIRI_RELEASE_URL
          print("compatibility patch registration: OK")
          PY

      - name: Generate Pascal house scene
        run: |
          uv run python models/house_200sqm/pascal/generate_scene.py \
            --spec models/house_200sqm/house_spec.json \
            --output .generated/house_200sqm/house_200sqm.pascal.json

      - name: Validate Pascal house scene
        run: uv run python models/house_200sqm/pascal/validate_scene.py .generated/house_200sqm/house_200sqm.pascal.json

      - name: Check launcher help
        run: uv run blender3d-control --help

  powershell-static:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem scripts -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Error ("PowerShell parse errors in {0}:`n{1}" -f $_.Name, ($errors | Out-String))
            } else {
              Write-Host ("{0}: OK" -f $_.Name)
            }
          }
          if ($failed) { exit 1 }

  house-blender-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate and validate Pascal scene with system Python
        run: |
          python3 models/house_200sqm/pascal/generate_scene.py \
            --spec models/house_200sqm/house_spec.json \
            --output .generated/house_200sqm/house_200sqm.pascal.json
          python3 models/house_200sqm/pascal/validate_scene.py \
            .generated/house_200sqm/house_200sqm.pascal.json

      - name: Install Blender runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy
          blender --version | head -n 1
          python3 -c "import numpy; print('system numpy', numpy.__version__)"

      - name: Build house in isolated Blender Python
        run: |
          mkdir -p models/house_200sqm/output
          env -u PYTHONHOME -u PYTHONPATH blender --background \
            --python models/house_200sqm/blender/build_house_from_pascal.py \
            -- \
            --input .generated/house_200sqm/house_200sqm.pascal.json \
            --output models/house_200sqm/output/house_200sqm.blend \
            --export-glb models/house_200sqm/output/house_200sqm.glb
          test -s models/house_200sqm/output/house_200sqm.blend
          test -s models/house_200sqm/output/house_200sqm.glb

      - name: Upload house artifacts
        uses: actions/upload-artifact@v4
        with:
          name: house-200sqm-blender-pascal
          path: |
            .generated/house_200sqm/house_200sqm.pascal.json
            models/house_200sqm/output/house_200sqm.blend
            models/house_200sqm/output/house_200sqm.glb
          if-no-files-found: error
