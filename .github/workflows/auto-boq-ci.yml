name: Automatic BOQ benchmark
on:
  push:
    branches: ['feature/automatic-boq-*']
    paths:
      - 'integrations/opentakeoff/**'
      - 'web/opentakeoff-poc/**'
      - '.github/workflows/auto-boq-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: automatic-boq-benchmark-${{ github.ref }}
  cancel-in-progress: true
jobs:
  family4:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: integrations/opentakeoff/requirements-auto-boq.txt
      - name: Install pinned PDF geometry detector dependencies
        run: python -m pip install --disable-pip-version-check -r integrations/opentakeoff/requirements-auto-boq.txt
      - name: Fetch the exact public Family4 benchmark PDF
        run: python integrations/opentakeoff/fetch_sample.py --output .generated/samples/family4.pdf
      - name: Generate Automatic BOQ from drawing pages only
        run: |
          python integrations/opentakeoff/auto_boq.py \
            --pdf .generated/samples/family4.pdf \
            --profile integrations/opentakeoff/profiles/family4.json \
            --output .generated/auto/auto-boq.json
      - name: Run leak guard and quantity regression tests
        run: |
          python integrations/opentakeoff/test_auto_boq.py \
            --pdf .generated/samples/family4.pdf \
            --profile integrations/opentakeoff/profiles/family4.json \
            --reference integrations/opentakeoff/benchmark_reference.json
      - name: Score only after generation has completed
        run: |
          python integrations/opentakeoff/score_auto_boq.py \
            --generated .generated/auto/auto-boq.json \
            --reference integrations/opentakeoff/benchmark_reference.json \
            --output .generated/auto/auto-boq-benchmark.json
      - name: Assert benchmark contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          g=json.loads(Path('.generated/auto/auto-boq.json').read_text())
          b=json.loads(Path('.generated/auto/auto-boq-benchmark.json').read_text())
          assert g['source_policy']['reference_used_for_generation'] is False
          assert g['source_policy']['drawing_pages']==[1,71]
          assert all(max(r['source_pages']) <= 71 for r in g['rows'])
          assert len(g['rows']) == 12
          by={r['id']:r for r in g['rows']}
          assert by['SAN-WC-BOWL']['quantity']==3 and by['SAN-WC-BOWL']['source_pages']==[23,24,25]
          assert by['SAN-LAVATORY']['quantity']==3 and by['SAN-LAVATORY']['source_pages']==[23,24,25]
          assert by['SAN-SHOWER-SET']['quantity']==2 and by['SAN-SHOWER-SET']['source_pages']==[24,25]
          assert b['scope']=='AUDIT_SUBSET_ONLY_NOT_FULL_BOQ'
          assert b['reference_rows']==13 and b['detected_reference_rows']==12
          assert b['coverage_pct']>=92.3
          assert b['detected_rows_accuracy_pct']==100
          assert b['mean_absolute_error_pct'] < 0.25
          print('AUTO_BOQ_CONTRACT_PASS', {'rows':len(g['rows']),'coverage':b['coverage_pct'],'mae':b['mean_absolute_error_pct']})
          PY
      - name: Retain generated quantities and score evidence
        uses: actions/upload-artifact@v4
        with:
          name: automatic-boq-family4
          path: .generated/auto/
