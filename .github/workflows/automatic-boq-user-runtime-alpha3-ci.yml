name: Automatic BOQ User PDF Runtime Alpha3 CI

on:
  push:
    branches:
      - feat/auto-boq-user-pipe-geometry-alpha
    paths:
      - 'web/opentakeoff-poc/browser-auto-boq-alpha3*.mjs'
      - 'web/opentakeoff-poc/browser-pipe-geometry*.mjs'
      - 'web/opentakeoff-poc/runtime_smoke.py'
      - 'integrations/opentakeoff/**'
      - '.github/workflows/automatic-boq-user-runtime-alpha3-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: automatic-boq-user-runtime-alpha3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-runtime-alpha3:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: integrations/opentakeoff/requirements-auto-boq.txt
      - name: Install Automatic BOQ dependencies
        run: python -m pip install --disable-pip-version-check -r integrations/opentakeoff/requirements-auto-boq.txt
      - name: Fetch exact pinned OpenTakeoff upstream
        uses: actions/checkout@v4
        with:
          repository: Kentucky-ai/opentakeoff
          ref: 7a3c8eb44252d0d9083157ad9677866f92f711bb
          path: .external/opentakeoff-poc
          persist-credentials: false
      - name: Fetch verified Family4 PDF
        run: python integrations/opentakeoff/fetch_sample.py --output .generated/samples/family4.pdf
      - name: Test Alpha3 positioned pipe evidence contracts
        run: >-
          node --test
          web/opentakeoff-poc/browser-auto-boq-alpha3.test.mjs
          web/opentakeoff-poc/browser-pipe-geometry.test.mjs
          web/opentakeoff-poc/browser-pipe-geometry-safe.test.mjs
      - name: Build v8.19 OpenTakeoff POC
        run: >-
          python integrations/opentakeoff/build.py
          --upstream .external/opentakeoff-poc
          --output .generated/pages/takeoff
          --demo-pdf .generated/samples/family4.pdf
      - name: Install pinned PDF.js user runtime
        run: >-
          python integrations/opentakeoff/install_browser_runtime.py
          --upstream .external/opentakeoff-poc
          --output .generated/pages/takeoff
      - name: Switch generated user runtime to Alpha3 only for this QA artifact
        run: |
          cp web/opentakeoff-poc/browser-auto-boq-alpha3.mjs .generated/pages/takeoff/browser-auto-boq-alpha3.mjs
          python - <<'PY'
          from pathlib import Path
          p=Path('.generated/pages/takeoff/poc.js')
          text=p.read_text(encoding='utf-8')
          old="import('./browser-auto-boq-alpha2.mjs')"
          new="import('./browser-auto-boq-alpha3.mjs')"
          assert text.count(old)==1, text.count(old)
          p.write_text(text.replace(old,new),encoding='utf-8')
          PY
      - name: Assert production demo remains isolated
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('.generated/pages/takeoff')
          auto=json.loads((root/'auto-boq.json').read_text())
          pipe=[r for r in auto['rows'] if str(r.get('id','')).startswith('SAN-PIPE-')]
          assert len(auto['rows'])==27,len(auto['rows'])
          assert len(pipe)==8,len(pipe)
          assert abs(sum(float(r['quantity']) for r in pipe)-92.5)<1e-6,pipe
          assert auto['source_policy']['reference_used_for_generation'] is False
          assert (root/'browser-auto-boq-alpha3.mjs').is_file()
          print('ALPHA3_DEMO_ISOLATION_PASS',{'rows':27,'pipe_total_m':92.5})
          PY
      - name: Install Chromium QA runtime
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Run focused user PDF runtime QA with Alpha3 diagnostics
        run: python web/opentakeoff-poc/runtime_smoke.py --root .generated/pages --out .generated/user-runtime-alpha3-qa
      - name: Retain Alpha3 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automatic-boq-user-runtime-alpha3
          path: |
            .generated/pages/takeoff/
            .generated/user-runtime-alpha3-qa/
          if-no-files-found: warn
          retention-days: 30
