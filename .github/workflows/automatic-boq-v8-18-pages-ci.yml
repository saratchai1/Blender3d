name: Automatic BOQ v8.18 full POC CI

on:
  push:
    branches:
      - feat/auto-boq-v8-pipe-network
    paths:
      - 'integrations/opentakeoff/**'
      - 'web/opentakeoff-poc/**'
      - '.github/workflows/automatic-boq-v8-18-pages-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auto-boq-v8-18-full-poc
  cancel-in-progress: true

jobs:
  full-poc:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: integrations/opentakeoff/requirements-auto-boq.txt
      - name: Install Automatic BOQ dependencies
        run: python -m pip install --disable-pip-version-check -r integrations/opentakeoff/requirements-auto-boq.txt
      - name: Fetch exact pinned OpenTakeoff upstream
        uses: actions/checkout@v4
        with:
          repository: Kentucky-ai/opentakeoff
          ref: 7a3c8eb44252d0d9083157ad9677866f92f711bb
          path: .external/opentakeoff-poc
          persist-credentials: false
      - name: Fetch verified Family4 PDF
        run: python integrations/opentakeoff/fetch_sample.py --output .generated/samples/family4.pdf
      - name: Build v8.18 Automatic BOQ POC
        run: >-
          python integrations/opentakeoff/build.py
          --upstream .external/opentakeoff-poc
          --output .generated/pages/takeoff
          --demo-pdf .generated/samples/family4.pdf
      - name: Assert generated v8.18 build metadata
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('.generated/pages/takeoff')
          auto=json.loads((root/'auto-boq.json').read_text())
          info=json.loads((root/'build-info.json').read_text())
          pipe=[r for r in auto['rows'] if str(r.get('id','')).startswith('SAN-PIPE-')]
          assert len(auto['rows'])==27,len(auto['rows'])
          assert len(pipe)==8,pipe
          assert abs(sum(float(r['quantity']) for r in pipe)-92.5)<1e-6,pipe
          assert auto['source_policy']['reference_used_for_generation'] is False
          assert all(max(r['source_pages'])<=71 for r in auto['rows'])
          diag=next(d for d in auto['diagnostics'] if d.get('detector')=='sanitary_pipe_network_v8_18')
          assert diag['reconciliation']['full_pipe_boq_publication_status']=='PUBLISHED_VALIDATED_PIPE_ROWS',diag
          assert diag['pipe_release_candidate']['release_blocker_count']==0,diag
          assert diag['vertical_level_bounded_reconciliation']['valve_leader_promoted_count']==1,diag
          net=info['automatic_boq']['pipe_network']
          assert net['published_pipe_rows']==8,net
          assert abs(net['published_pipe_total_m']-92.5)<1e-6,net
          assert net['release_blockers']==0,net
          assert net['excluded_non_quantity_runs']==9,net
          assert net['valve_leader_promoted']==1,net
          print('V8_18_BUILD_METADATA_PASS',{'rows':len(auto['rows']),'pipe_rows':len(pipe),'pipe_total_m':92.5})
          PY
      - name: Install Chromium QA runtime
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Run full Automatic BOQ browser QA
        run: python web/opentakeoff-poc/smoke.py --root .generated/pages --out .generated/takeoff-qa
      - name: Retain v8.18 full build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automatic-boq-v8-18-full-poc
          path: |
            .generated/pages/takeoff/
            .generated/takeoff-qa/
          if-no-files-found: warn
          retention-days: 30
