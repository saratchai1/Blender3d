name: Automatic BOQ v8.18 valve release CI

on:
  push:
    branches:
      - feat/auto-boq-v8-pipe-network
    paths:
      - 'integrations/opentakeoff/auto_boq_v8_18.py'
      - 'integrations/opentakeoff/vertical_valve_leader_reconcile_v8.py'
      - 'integrations/opentakeoff/test_vertical_valve_leader_reconcile_v8.py'
      - 'integrations/opentakeoff/probe_cw_valve_leaders_v8.py'
      - 'integrations/opentakeoff/pipe_release_reconcile_v8.py'
      - 'integrations/opentakeoff/test_pipe_release_reconcile_v8.py'
      - 'integrations/opentakeoff/pipe_publish_v8.py'
      - 'integrations/opentakeoff/auto_boq_v8_15.py'
      - 'integrations/opentakeoff/roof_terminal_reconcile_v8.py'
      - 'integrations/opentakeoff/profiles/family4_roof_level_evidence.json'
      - 'integrations/opentakeoff/auto_boq_v8_14.py'
      - 'integrations/opentakeoff/vertical_direct_branch_v8.py'
      - 'integrations/opentakeoff/auto_boq_v8_13.py'
      - 'integrations/opentakeoff/vertical_level_bounds_v8.py'
      - 'integrations/opentakeoff/auto_boq_v8_11.py'
      - 'integrations/opentakeoff/profiles/family4.json'
      - 'integrations/opentakeoff/fetch_sample.py'
      - 'integrations/opentakeoff/requirements-auto-boq.txt'
      - '.github/workflows/automatic-boq-v8-18-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  family4-v8-18:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: integrations/opentakeoff/requirements-auto-boq.txt
      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check -r integrations/opentakeoff/requirements-auto-boq.txt
      - name: Run valve release and upstream regressions
        working-directory: integrations/opentakeoff
        run: |
          python test_vertical_valve_leader_reconcile_v8.py
          python test_pipe_release_reconcile_v8.py
          python test_roof_terminal_reconcile_v8.py
          python test_vertical_direct_branch_v8.py
          python test_vertical_level_bounds_v8.py
          python test_vertical_schematic_v8.py
          python test_cross_view_system_consensus_v8.py
          python test_strict_pipe_tags_v8.py
      - name: Fetch exact Family4 source PDF
        run: python integrations/opentakeoff/fetch_sample.py --output .generated/samples/family4.pdf
      - name: Generate v8.15 non-publishing control
        run: >-
          python integrations/opentakeoff/auto_boq_v8_15.py
          --pdf .generated/samples/family4.pdf
          --profile integrations/opentakeoff/profiles/family4.json
          --roof-evidence integrations/opentakeoff/profiles/family4_roof_level_evidence.json
          --output .generated/v8-15-control.json
      - name: Generate v8.18 valve-reconciled publication
        run: >-
          python integrations/opentakeoff/auto_boq_v8_18.py
          --pdf .generated/samples/family4.pdf
          --profile integrations/opentakeoff/profiles/family4.json
          --roof-evidence integrations/opentakeoff/profiles/family4_roof_level_evidence.json
          --output .generated/v8-18.json
      - name: Assert valve evidence, release gate and published quantities
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('.generated/v8-15-control.json').read_text())
          n=json.loads(Path('.generated/v8-18.json').read_text())
          assert c['source_policy']['reference_used_for_generation'] is False
          assert n['source_policy']['reference_used_for_generation'] is False
          assert len(c['rows'])==19
          dn=next(d for d in n['diagnostics'] if d.get('detector')=='sanitary_pipe_network_v8_18')
          vertical=dn['vertical_level_bounded_reconciliation']
          final=dn['pipe_release_candidate']
          probe=dn['cw_valve_leader_evidence']
          assert dn['reconciliation']['horizontal_diameter_gate']=='PASS'
          assert probe['source_page']==57 and probe['source_page_max']==71
          assert probe['callout_count']==2 and probe['associated_count']==2,probe
          ball=next(x for x in probe['callouts'] if x['name']=='BALL VALVE')
          assert ball['diameter']['diameter_key']=='DN15',ball
          assert ball['leader']['status']=='ASSOCIATED_BY_LEADER_TO_PDF_CAD_LAYER',ball
          assert ball['target_segment']['segment_index']==183,ball
          assert vertical['valve_leader_promoted_count']==1,vertical
          promoted=vertical['valve_leader_promoted_runs'][0]
          assert promoted['segment_indexes']==[182,183,184,185,186,187],promoted
          assert promoted['diameter_key']=='DN15' and promoted['superseded_inferred_diameter_key']=='DN20',promoted
          assert abs(promoted['vertical_length_m_candidate']-1.228)<1e-6,promoted
          assert vertical['withheld_run_count']==9,vertical
          assert final['status']=='PASS_VALIDATED_PIPE_RELEASE_CANDIDATE',final
          assert final['publication_policy']=='READY_FOR_PIPE_ROW_PUBLICATION',final
          assert final['release_blocker_count']==0,final
          assert final['excluded_non_quantity_run_count']==9,final
          v_ex=[x for x in final['excluded_non_quantity_runs'] if x['system']=='V']
          cw_ex=[x for x in final['excluded_non_quantity_runs'] if x['system']=='CW']
          assert len(v_ex)==2 and all(x['release_exclusion_status']=='EXCLUDED_TERMINAL_PIECE_ALREADY_REPRESENTED_BY_ROOF_MAIN_RISER' for x in v_ex),v_ex
          assert len(cw_ex)==7 and all(x['vertical_span_m']<0.5 for x in cw_ex),cw_ex
          pipe=[r for r in n['rows'] if str(r.get('id','')).startswith('SAN-PIPE-')]
          assert len(n['rows'])==27,(len(n['rows']),len(pipe))
          assert len(pipe)==8,pipe
          quantities={r['id']:r['quantity'] for r in pipe}
          expected={
              'SAN-PIPE-CW-DN15':8.524,
              'SAN-PIPE-CW-DN20':26.112,
              'SAN-PIPE-RL-DN65':3.57,
              'SAN-PIPE-S-DN100':2.27,
              'SAN-PIPE-SW-DN100':19.455,
              'SAN-PIPE-V-DN50':14.665,
              'SAN-PIPE-W-DN50':10.746,
              'SAN-PIPE-W-DN65':7.158,
          }
          assert quantities==expected,(quantities,expected)
          assert abs(sum(quantities.values())-92.5)<1e-6,quantities
          assert dn['reconciliation']['full_pipe_boq_publication_status']=='PUBLISHED_VALIDATED_PIPE_ROWS'
          print('AUTO_BOQ_V8_18_VALVE_RELEASE_PASS',{
              'pipe_rows':len(pipe),
              'pipe_total_m':sum(quantities.values()),
              'cw_dn15_m':quantities['SAN-PIPE-CW-DN15'],
              'excluded':final['excluded_non_quantity_run_count'],
              'blockers':0,
          })
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: automatic-boq-v8-18-evidence
          path: |
            .generated/v8-15-control.json
            .generated/v8-18.json
          if-no-files-found: warn
          retention-days: 30
