name: Automatic BOQ v8.15 roof terminal CI

on:
  push:
    branches:
      - feat/auto-boq-v8-pipe-network
    paths:
      - 'integrations/opentakeoff/auto_boq_v8_15.py'
      - 'integrations/opentakeoff/roof_terminal_reconcile_v8.py'
      - 'integrations/opentakeoff/test_roof_terminal_reconcile_v8.py'
      - 'integrations/opentakeoff/profiles/family4_roof_level_evidence.json'
      - 'integrations/opentakeoff/auto_boq_v8_14.py'
      - 'integrations/opentakeoff/vertical_direct_branch_v8.py'
      - 'integrations/opentakeoff/auto_boq_v8_13.py'
      - 'integrations/opentakeoff/vertical_level_bounds_v8.py'
      - 'integrations/opentakeoff/auto_boq_v8_12.py'
      - 'integrations/opentakeoff/vertical_schematic_v8.py'
      - 'integrations/opentakeoff/auto_boq_v8_11.py'
      - 'integrations/opentakeoff/profiles/family4.json'
      - 'integrations/opentakeoff/fetch_sample.py'
      - 'integrations/opentakeoff/requirements-auto-boq.txt'
      - '.github/workflows/automatic-boq-v8-15-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  family4-v8-15:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: integrations/opentakeoff/requirements-auto-boq.txt
      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check -r integrations/opentakeoff/requirements-auto-boq.txt
      - name: Run roof terminal and upstream regressions
        working-directory: integrations/opentakeoff
        run: |
          python test_roof_terminal_reconcile_v8.py
          python test_vertical_direct_branch_v8.py
          python test_vertical_level_bounds_v8.py
          python test_vertical_schematic_v8.py
          python test_cross_view_system_consensus_v8.py
          python test_strict_pipe_tags_v8.py
      - name: Fetch exact Family4 source PDF
        run: python integrations/opentakeoff/fetch_sample.py --output .generated/samples/family4.pdf
      - name: Generate v8.14 control
        run: >-
          python integrations/opentakeoff/auto_boq_v8_14.py
          --pdf .generated/samples/family4.pdf
          --profile integrations/opentakeoff/profiles/family4.json
          --output .generated/v8-14-control.json
      - name: Generate v8.15 roof-corroborated diagnostic
        run: >-
          python integrations/opentakeoff/auto_boq_v8_15.py
          --pdf .generated/samples/family4.pdf
          --profile integrations/opentakeoff/profiles/family4.json
          --roof-evidence integrations/opentakeoff/profiles/family4_roof_level_evidence.json
          --output .generated/v8-15.json
      - name: Assert roof evidence is source-only and non-additive
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('.generated/v8-14-control.json').read_text())
          n=json.loads(Path('.generated/v8-15.json').read_text())
          assert c['source_policy']['reference_used_for_generation'] is False
          assert n['source_policy']['reference_used_for_generation'] is False
          assert len(c['rows'])==len(n['rows'])==19
          assert not any(str(r.get('id','')).startswith('SAN-PIPE-') for r in n['rows'])
          dc=next(d for d in c['diagnostics'] if d.get('detector')=='sanitary_pipe_network_v8_14')
          dn=next(d for d in n['diagnostics'] if d.get('detector')=='sanitary_pipe_network_v8_15')
          assert dn['reconciliation']['horizontal_diameter_gate']=='PASS'
          evidence=dn['architectural_roof_evidence']
          assert evidence['reference_used'] is False and evidence['generation_allowed'] is True,evidence
          assert evidence['source_page']==13 and evidence['source_page']<=evidence['source_page_max']==71,evidence
          assert evidence['roof_elevation_m']==6.65,evidence
          assert evidence['allowed_systems']==['V'],evidence
          b=dn['vertical_level_bounded_reconciliation']
          assert b['roof_terminal_status']=='APPLIED',b
          assert b['roof_extended_run_count']==2,b
          ext=b['roof_extended_runs']
          assert all(r['system']=='V' and r['diameter_key']=='DN50' for r in ext),ext
          assert all(r['classification_status']=='CANDIDATE_CORROBORATED_TO_ARCHITECTURAL_ROOF' for r in ext),ext
          assert all(r['vertical_length_m_candidate']==6.65 for r in ext),ext
          assert all(r['roof_top_error_m']<=0.15 for r in ext),ext
          rows={(r['system'],r['diameter_key']):r for r in b['candidate_rows']}
          assert rows[('V','DN50')]['vertical_length_m_candidate']==13.3,rows
          assert rows[('CW','DN20')]['vertical_length_m_candidate']==6.3,rows
          assert rows[('SW','DN100')]['vertical_length_m_candidate']==8.1,rows
          assert 2.44 <= rows[('W','DN65')]['vertical_length_m_candidate'] <= 2.46,rows
          # The separate short AVC/terminal geometry stays withheld; roof extension is represented only by the main riser.
          terminal=[r for r in b['withheld_runs'] if r.get('system')=='V' and float(r.get('terminal_extension_above_m',0))>0]
          assert len(terminal)>=2,terminal
          assert b['publication_policy']=='DIAGNOSTIC_ONLY_NO_VERTICAL_PUBLICATION'
          assert dn['reconciliation']['full_pipe_boq_publication_status'].startswith('WITHHELD_')
          print('AUTO_BOQ_V8_15_ROOF_PASS',{
              'roof_level_m':evidence['roof_elevation_m'],
              'extended_runs':b['roof_extended_run_count'],
              'vertical_rows':{str(k):v['vertical_length_m_candidate'] for k,v in rows.items()},
              'remaining_withheld':b['withheld_run_count'],
              'pipe_rows':0,
          })
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: automatic-boq-v8-15-evidence
          path: |
            .generated/v8-14-control.json
            .generated/v8-15.json
          if-no-files-found: warn
          retention-days: 30
