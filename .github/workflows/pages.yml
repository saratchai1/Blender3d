name: Deploy Blender3d, cinematic film and OpenTakeoff to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'web/office_10000sqm/**'
      - 'web/opentakeoff-poc/**'
      - 'integrations/opentakeoff/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: solstice-github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate original model and build original website plus cinematic film
        run: |
          node --test web/office_10000sqm/tools/model.test.mjs
          node web/office_10000sqm/tools/build-pages.mjs
          node web/office_10000sqm/cinematic/build.mjs
      - uses: actions/checkout@v4
        with:
          repository: Kentucky-ai/opentakeoff
          ref: 7a3c8eb44252d0d9083157ad9677866f92f711bb
          path: .external/opentakeoff-poc
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and test the pinned real OpenTakeoff engine
        run: python integrations/opentakeoff/build.py --upstream .external/opentakeoff-poc --output .generated/pages/takeoff
      - name: Install browser QA runtime
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Check existing presentation, WebGL and IFC downloads
        run: python web/office_10000sqm/tools/pages_smoke.py --root .generated/pages
      - name: Check actual takeoff canvas, PDF upload, metric BOQ, persistence and exports
        run: python web/opentakeoff-poc/smoke.py --root .generated/pages
      - name: Check actual moving cinematic cameras, six scenes, controls and mobile WebGL
        run: python web/office_10000sqm/cinematic/smoke.py --root .generated/pages
      - name: Retain browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blender3d-pages-qa
          path: |
            .generated/pages-qa/
            .generated/takeoff-qa/
            .generated/cinematic-qa/
          if-no-files-found: warn
      - name: Retain portable POC build
        uses: actions/upload-artifact@v4
        with:
          name: opentakeoff-poc-static
          path: .generated/pages/takeoff/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .generated/pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check first-time Pages activation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(gh api "repos/$GITHUB_REPOSITORY" --jq .has_pages)" != 'true' ]; then
            echo '::error::GitHub Pages is disabled. Select GitHub Actions in Settings > Pages and rerun deployment.'
            exit 1
          fi
      - uses: actions/configure-pages@v5
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
  verify-live:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install live browser test runtime
        run: |
          pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Verify public HTTPS HTML and actual animated WebGL after deployment
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          python web/office_10000sqm/cinematic/smoke.py --url "${PAGE_URL%/}/cinematic/" --output .generated/cinematic-live-qa
      - name: Retain live site validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cinematic-live-qa
          path: .generated/cinematic-live-qa/
          if-no-files-found: warn
