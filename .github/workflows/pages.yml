name: Deploy Interactive 3D
on:
  push:
    branches: [main]
    paths: ['spec/**','blender/**','web/**','.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender 4.5 LTS
        run: |
          BLENDER_VERSION=4.5.14 ./scripts/install_blender.sh > .blender-path
          echo "$(cat .blender-path)" >> "$GITHUB_PATH"
      - name: Build GLB
        run: blender --background --python blender/build_model.py -- --spec spec/building.json --output-dir dist
      - name: Assemble static website
        run: |
          mkdir -p site/assets
          cp web/index.html web/style.css web/app.js site/
          cp dist/building.glb site/assets/building.glb
          touch site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
