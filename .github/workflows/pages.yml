name: Deploy SOLSTICE 14 to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'web/office_10000sqm/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: solstice-github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source geometry and build public website
        run: |
          node --test web/office_10000sqm/tools/model.test.mjs
          node web/office_10000sqm/tools/build-pages.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser QA runtime
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Check HTML, mobile/desktop WebGL, chapters and IFC downloads
        run: python web/office_10000sqm/tools/pages_smoke.py --root .generated/pages
      - name: Retain browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: solstice-pages-qa
          path: .generated/pages-qa/
          if-no-files-found: warn
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .generated/pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check first-time Pages activation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(gh api "repos/$GITHUB_REPOSITORY" --jq .has_pages)" != 'true' ]; then
            echo '::error::GitHub Pages is disabled. A repository administrator must open Settings > Pages > Build and deployment > Source and select GitHub Actions, then rerun this failed deploy job. This workflow cannot grant itself repository administration permission.'
            exit 1
          fi
      - uses: actions/configure-pages@v5
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
