name: Deploy Blender3d, cinematic film and Automatic BOQ to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'web/office_10000sqm/**'
      - 'web/opentakeoff-poc/**'
      - 'integrations/opentakeoff/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
  workflow_run:
    workflows: ['Render SOLSTICE architectural film MP4', 'Complete SOLSTICE Cycles film recovery']
    types: [completed]
permissions:
  contents: read
concurrency:
  group: solstice-github-pages
  cancel-in-progress: true
jobs:
  build:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate original model and build original website plus cinematic film
        run: |
          node --test web/office_10000sqm/tools/model.test.mjs
          node web/office_10000sqm/tools/build-pages.mjs
          node web/office_10000sqm/cinematic/build.mjs
      - uses: actions/checkout@v4
        with:
          repository: Kentucky-ai/opentakeoff
          ref: 7a3c8eb44252d0d9083157ad9677866f92f711bb
          path: .external/opentakeoff-poc
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: integrations/opentakeoff/requirements-auto-boq.txt
      - name: Install pinned Automatic BOQ PDF geometry dependencies
        run: python -m pip install --disable-pip-version-check -r integrations/opentakeoff/requirements-auto-boq.txt
      - name: Fetch verified real Thai BOQ benchmark PDF
        run: python integrations/opentakeoff/fetch_sample.py --output .generated/samples/family4.pdf
      - name: Build real OpenTakeoff plus leak-proof Automatic BOQ
        run: python integrations/opentakeoff/build.py --upstream .external/opentakeoff-poc --output .generated/pages/takeoff --demo-pdf .generated/samples/family4.pdf
      - name: Install pinned PDF.js user Automatic BOQ runtime
        run: python integrations/opentakeoff/install_browser_runtime.py --upstream .external/opentakeoff-poc --output .generated/pages/takeoff
      - name: Assert user runtime assets are packaged without reference dependency
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('.generated/pages/takeoff')
          info=json.loads((root/'browser-runtime-info.json').read_text())
          assert info['network_dependency'] is False, info
          assert info['reference_data_dependency'] is False, info
          assert info['pdfjs_version'].startswith('4.10.'), info
          for rel in ('browser-auto-boq.mjs','vendor/pdf.mjs','vendor/pdf.worker.mjs'):
              assert (root/rel).is_file(), rel
          print('PAGES_USER_RUNTIME_ASSETS_PASS', {'pdfjs':info['pdfjs_version']})
          PY
      - name: Install browser QA runtime
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Check existing presentation, WebGL and IFC downloads
        run: python web/office_10000sqm/tools/pages_smoke.py --root .generated/pages
      - name: Check Automatic BOQ, reference fence, native PDF review and no double counting
        run: python web/opentakeoff-poc/smoke.py --root .generated/pages
      - name: Check focused user PDF Browser Runtime Alpha
        run: python web/opentakeoff-poc/runtime_smoke.py --root .generated/pages
      - name: Check actual moving cinematic cameras, six scenes, controls and mobile WebGL
        run: python web/office_10000sqm/cinematic/smoke.py --root .generated/pages
      - name: Check the completed offline MP4 player when present
        run: python models/office_10000sqm/film/smoke_player.py --root .generated/pages
      - name: Retain browser and Automatic BOQ evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blender3d-pages-qa
          path: |
            .generated/pages-qa/
            .generated/takeoff-qa/
            .generated/user-runtime-qa/
            .generated/cinematic-qa/
            .generated/film-player-qa/
            .generated/pages/takeoff/auto-boq.json
            .generated/pages/takeoff/auto-boq-benchmark.json
            .generated/pages/takeoff/browser-runtime-info.json
            .generated/pages/takeoff/build-info.json
          if-no-files-found: warn
      - name: Retain portable Automatic BOQ POC build
        uses: actions/upload-artifact@v4
        with:
          name: opentakeoff-automatic-boq-poc-static
          path: .generated/pages/takeoff/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .generated/pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check first-time Pages activation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(gh api "repos/$GITHUB_REPOSITORY" --jq .has_pages)" != 'true' ]; then
            echo '::error::GitHub Pages is disabled. Select GitHub Actions in Settings > Pages and rerun deployment.'
            exit 1
          fi
      - uses: actions/configure-pages@v5
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
  verify-live:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install live browser test runtime
        run: |
          pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Verify public Automatic BOQ and leak-proof evidence JSON
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: python web/opentakeoff-poc/live_smoke.py --url "${PAGE_URL%/}/takeoff/" --output .generated/takeoff-live-qa
      - name: Verify public HTTPS animated WebGL remains intact
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: python web/office_10000sqm/cinematic/smoke.py --url "${PAGE_URL%/}/cinematic/" --output .generated/cinematic-live-qa
      - name: Verify live offline MP4 playback when the finished movie exists
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          if [ -f web/office_10000sqm/film/SOLSTICE-14-Architectural-Film.mp4 ]; then
            python models/office_10000sqm/film/smoke_player.py --url "${PAGE_URL%/}/office_10000sqm/film/" --output .generated/film-live-qa
          fi
      - name: Retain live validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automatic-boq-and-cinematic-live-qa
          path: |
            .generated/takeoff-live-qa/
            .generated/cinematic-live-qa/
            .generated/film-live-qa/
          if-no-files-found: warn
