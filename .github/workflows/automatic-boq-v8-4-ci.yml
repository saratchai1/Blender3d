name: Automatic BOQ v8.4 evidence CI

on:
  push:
    branches:
      - feat/auto-boq-v8-pipe-network
    paths:
      - 'integrations/opentakeoff/auto_boq_v8_1.py'
      - 'integrations/opentakeoff/auto_boq_v8_2.py'
      - 'integrations/opentakeoff/auto_boq_v8_4.py'
      - 'integrations/opentakeoff/leader_association_v8.py'
      - 'integrations/opentakeoff/detail_reconcile_v8.py'
      - 'integrations/opentakeoff/fixture_schedule_v8.py'
      - 'integrations/opentakeoff/profiles/family4.json'
      - 'integrations/opentakeoff/fetch_sample.py'
      - 'integrations/opentakeoff/requirements-auto-boq.txt'
      - '.github/workflows/automatic-boq-v8-4-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  family4-v8-4:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: integrations/opentakeoff/requirements-auto-boq.txt
      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check -r integrations/opentakeoff/requirements-auto-boq.txt
      - name: Fetch exact Family4 source PDF
        run: python integrations/opentakeoff/fetch_sample.py --output .generated/samples/family4.pdf
      - name: Generate v8.3 control from current v8.1 pipeline
        run: >-
          python integrations/opentakeoff/auto_boq_v8_1.py
          --pdf .generated/samples/family4.pdf
          --profile integrations/opentakeoff/profiles/family4.json
          --output .generated/v8-3-control.json
      - name: Generate combined v8.4 diagnostic
        run: >-
          python integrations/opentakeoff/auto_boq_v8_4.py
          --pdf .generated/samples/family4.pdf
          --profile integrations/opentakeoff/profiles/family4.json
          --output .generated/v8-4.json
      - name: Assert no publication regression and compare primary coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          c=json.loads(Path('.generated/v8-3-control.json').read_text())
          n=json.loads(Path('.generated/v8-4.json').read_text())
          assert c['source_policy']['reference_used_for_generation'] is False
          assert n['source_policy']['reference_used_for_generation'] is False
          assert len(c['rows']) == len(n['rows']) == 19
          assert not any(str(r.get('id','')).startswith('SAN-PIPE-') for r in n['rows'])

          dc=next(d for d in c['diagnostics'] if d.get('detector')=='sanitary_pipe_network_v8_1')
          dn=next(d for d in n['diagnostics'] if d.get('detector')=='sanitary_pipe_network_v8_4')
          cp={p['sheet']:p['diameter_coverage']['assigned_fraction'] for p in dc['pages'] if p.get('contribution_policy')=='PRIMARY_PLAN_HORIZONTAL'}
          np={p['sheet']:p['diameter_coverage']['assigned_fraction'] for p in dn['pages'] if p.get('contribution_policy')=='PRIMARY_PLAN_HORIZONTAL'}
          assert set(cp) == set(np) == {'SN-05','SN-06'}
          assert all(np[k] >= cp[k] for k in cp), (cp,np)
          assert dn['fixture_branch_schedule']['connection_count'] == 18
          assert len(dn['detail_view_reconciliation']) == 3
          assert dn['reconciliation']['cross_view_policy_status'] == 'PASS_NON_ADDITIVE_BY_VIEW_ROLE'
          assert dn['reconciliation']['full_pipe_boq_publication_status'].startswith('WITHHELD_')
          assert dn['leader_association_summary']['SN-05']['accepted_leader_tags'] >= 1
          print('AUTO_BOQ_V8_4_AB_PASS', {
              'control':cp,
              'combined':np,
              'leader_summary':dn['leader_association_summary'],
              'horizontal_gate':dn['reconciliation']['horizontal_diameter_gate'],
              'pipe_rows':0,
          })
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: automatic-boq-v8-4-evidence
          path: |
            .generated/v8-3-control.json
            .generated/v8-4.json
          if-no-files-found: warn
          retention-days: 30
