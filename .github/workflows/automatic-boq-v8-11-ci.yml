name: Automatic BOQ v8.11 cross-view consensus CI

on:
  push:
    branches:
      - feat/auto-boq-v8-pipe-network
    paths:
      - 'integrations/opentakeoff/auto_boq_v8_11.py'
      - 'integrations/opentakeoff/cross_view_system_consensus_v8.py'
      - 'integrations/opentakeoff/test_cross_view_system_consensus_v8.py'
      - 'integrations/opentakeoff/auto_boq_v8_10.py'
      - 'integrations/opentakeoff/rainwater_page_evidence_v8.py'
      - 'integrations/opentakeoff/auto_boq_v8_9.py'
      - 'integrations/opentakeoff/dashed_network_partition_v8.py'
      - 'integrations/opentakeoff/collinear_gap_bridge_v8.py'
      - 'integrations/opentakeoff/auto_boq_v8_7.py'
      - 'integrations/opentakeoff/auto_boq_v8_6.py'
      - 'integrations/opentakeoff/detail_short_branch_v8.py'
      - 'integrations/opentakeoff/strict_pipe_tags_v8.py'
      - 'integrations/opentakeoff/layer_topology_v8.py'
      - 'integrations/opentakeoff/auto_boq_v8_3.py'
      - 'integrations/opentakeoff/detail_view_transfer_v8.py'
      - 'integrations/opentakeoff/leader_association_v8.py'
      - 'integrations/opentakeoff/profiles/family4.json'
      - 'integrations/opentakeoff/fetch_sample.py'
      - 'integrations/opentakeoff/requirements-auto-boq.txt'
      - '.github/workflows/automatic-boq-v8-11-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  family4-v8-11:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: integrations/opentakeoff/requirements-auto-boq.txt
      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check -r integrations/opentakeoff/requirements-auto-boq.txt
      - name: Run cross-view and upstream safety regressions
        working-directory: integrations/opentakeoff
        run: |
          python test_cross_view_system_consensus_v8.py
          python test_rainwater_page_evidence_v8.py
          python test_dashed_network_partition_v8.py
          python test_detail_short_branch_v8.py
          python test_strict_pipe_tags_v8.py
      - name: Fetch exact Family4 source PDF
        run: python integrations/opentakeoff/fetch_sample.py --output .generated/samples/family4.pdf
      - name: Generate v8.10 control
        run: >-
          python integrations/opentakeoff/auto_boq_v8_10.py
          --pdf .generated/samples/family4.pdf
          --profile integrations/opentakeoff/profiles/family4.json
          --output .generated/v8-10-control.json
      - name: Generate v8.11 cross-view consensus diagnostic
        run: >-
          python integrations/opentakeoff/auto_boq_v8_11.py
          --pdf .generated/samples/family4.pdf
          --profile integrations/opentakeoff/profiles/family4.json
          --output .generated/v8-11.json
      - name: Assert horizontal gate and no publication regression
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          c=json.loads(Path('.generated/v8-10-control.json').read_text())
          n=json.loads(Path('.generated/v8-11.json').read_text())
          assert c['source_policy']['reference_used_for_generation'] is False
          assert n['source_policy']['reference_used_for_generation'] is False
          assert len(c['rows']) == len(n['rows']) == 19
          assert all(max(r['source_pages']) <= 71 for r in n['rows'])
          assert not any(str(r.get('id','')).startswith('SAN-PIPE-') for r in n['rows'])

          dc=next(d for d in c['diagnostics'] if d.get('detector')=='sanitary_pipe_network_v8_10')
          dn=next(d for d in n['diagnostics'] if d.get('detector')=='sanitary_pipe_network_v8_11')
          cp={p['sheet']:p['diameter_coverage']['assigned_fraction'] for p in dc['pages'] if p.get('contribution_policy')=='PRIMARY_PLAN_HORIZONTAL'}
          np={p['sheet']:p['diameter_coverage']['assigned_fraction'] for p in dn['pages'] if p.get('contribution_policy')=='PRIMARY_PLAN_HORIZONTAL'}
          assert cp['SN-05'] < 0.95 and cp['SN-06'] < 0.95, cp
          assert np['SN-05'] >= 0.95 and np['SN-06'] >= 0.95, np
          assert np['SN-05'] > cp['SN-05'] and np['SN-06'] > cp['SN-06'], (cp,np)

          s5=next(p for p in dn['pages'] if p.get('sheet')=='SN-05')
          s6=next(p for p in dn['pages'] if p.get('sheet')=='SN-06')
          e5=s5['cross_view_system_consensus']; e6=s6['cross_view_system_consensus']
          assert e5['SOIL']['status']=='CORROBORATED_PAGE_LOCAL_MULTI_VIEW_CLASS', e5
          assert (e5['SOIL']['system'],e5['SOIL']['diameter_key'])==('SW','DN100'), e5
          assert e5['WASTE']['status']=='CORROBORATED_PAGE_LOCAL_MULTI_VIEW_CLASS', e5
          assert (e5['WASTE']['system'],e5['WASTE']['diameter_key'])==('W','DN50'), e5
          assert e5['V']['status']=='WITHHELD_CONFLICTING_LOCAL_CLASSES', e5
          assert e6['CW']['status']=='CORROBORATED_PAGE_LOCAL_MULTI_VIEW_CLASS', e6
          assert (e6['CW']['system'],e6['CW']['diameter_key'])==('CW','DN20'), e6
          assert e6['SOIL']['status']=='CORROBORATED_PAGE_LOCAL_PLUS_SCHEMATIC_CLASS', e6
          assert (e6['SOIL']['system'],e6['SOIL']['diameter_key'])==('S','DN100'), e6

          seeded=[]
          for p in (s5,s6):
              pre={r['segment_index']:r for r in p['diameter_assignments_pre_cross_view_consensus']}
              for r in p['diameter_assignments']:
                  if r.get('status')=='CROSS_VIEW_CORROBORATED_SYSTEM_CLASS':
                      assert pre[r['segment_index']]['status']=='WITHHELD_NO_DIAMETER_EVIDENCE', (pre[r['segment_index']],r)
                      assert not pre[r['segment_index']].get('classes'), pre[r['segment_index']]
                      seeded.append(r)
          assert seeded, 'expected corroborated seeds'
          rec=dn['reconciliation']
          assert rec['cross_view_policy_status']=='PASS_NON_ADDITIVE_BY_VIEW_ROLE', rec
          assert rec['horizontal_diameter_gate']=='PASS', rec
          assert rec['full_pipe_boq_publication_status']=='WITHHELD_VERTICAL_AND_DETAIL_RECONCILIATION', rec
          assert not any(row['status'].startswith('WITHHELD_DIAMETER_TIE') for p in (s5,s6) for row in p['diameter_assignments'])
          print('AUTO_BOQ_V8_11_AB_PASS',{
              'control':cp,
              'cross_view':np,
              'seeded_segments':len(seeded),
              'horizontal_gate':rec['horizontal_diameter_gate'],
              'full_publication':rec['full_pipe_boq_publication_status'],
              'pipe_rows':0,
          })
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: automatic-boq-v8-11-evidence
          path: |
            .generated/v8-10-control.json
            .generated/v8-11.json
          if-no-files-found: warn
          retention-days: 30
