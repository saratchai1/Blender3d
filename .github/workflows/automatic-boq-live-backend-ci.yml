name: Automatic BOQ Live Backend CI

on:
  push:
    branches:
      - feat/auto-boq-live-backend
      - main
      - ci/render-exact-evidence-gate
    paths:
      - 'integrations/opentakeoff/runtime_backend.py'
      - 'integrations/opentakeoff/runtime_server.py'
      - 'integrations/opentakeoff/generic_profile_inference.py'
      - 'integrations/opentakeoff/test_runtime_backend.py'
      - 'integrations/opentakeoff/test_runtime_server.py'
      - 'integrations/opentakeoff/test_generic_profile_inference.py'
      - 'integrations/opentakeoff/requirements*.txt'
      - 'integrations/opentakeoff/auto_boq_v8_*.py'
      - 'integrations/opentakeoff/*_v8.py'
      - 'integrations/opentakeoff/profiles/**'
      - '.github/workflows/automatic-boq-live-backend-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: automatic-boq-live-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  http-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: integrations/opentakeoff/requirements-auto-boq.txt

      - name: Install pinned Automatic BOQ dependencies
        run: python -m pip install --disable-pip-version-check -r integrations/opentakeoff/requirements.txt

      - name: Test profile, generic inference, single-flight concurrency and HTTP contract
        run: |
          python integrations/opentakeoff/test_runtime_backend.py
          python integrations/opentakeoff/test_runtime_server.py
          python integrations/opentakeoff/test_generic_profile_inference.py

      - name: Fetch verified Family4 benchmark PDF
        run: python integrations/opentakeoff/fetch_sample.py --output .generated/samples/family4.pdf

      - name: Start guarded single-flight HTTP runtime
        env:
          PORT: '8765'
          BOQ_ALLOWED_ORIGINS: 'https://saratchai1.github.io'
          BOQ_MAX_CONCURRENT_JOBS: '1'
        run: |
          set -euo pipefail
          mkdir -p .generated/live-backend-qa
          python integrations/opentakeoff/runtime_server.py > .generated/live-backend-qa/server.log 2>&1 &
          echo $! > .generated/live-backend-qa/server.pid
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8765/health > .generated/live-backend-qa/health.json; then exit 0; fi
            sleep 1
          done
          cat .generated/live-backend-qa/server.log
          exit 1

      - name: Verify health contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          value=json.loads(Path('.generated/live-backend-qa/health.json').read_text())
          assert value['status']=='ok',value
          assert value['engine']=='v8.19-profile+generic-vector-v0',value
          assert value['generic_inference']=='vector-sanitary-v0',value
          assert value['registered_profiles']==1,value
          assert value['fail_closed_unknown_profiles'] is True,value
          assert value['max_upload_bytes']==30*1024*1024,value
          assert value['max_concurrent_jobs']==1,value
          assert value['concurrency_policy']=='SINGLE_FLIGHT_FAIL_CLOSED_RETRYABLE_429',value
          print('AUTO_BOQ_HTTP_HEALTH_PASS',value)
          PY

      - name: POST exact Family4 through HTTP backend
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X POST -H 'Content-Type: application/pdf' -H 'X-File-Name: family4.pdf' \
            -H 'Origin: https://saratchai1.github.io' \
            --data-binary @.generated/samples/family4.pdf \
            http://127.0.0.1:8765/api/auto-boq > .generated/live-backend-qa/family4-runtime.json
          python - <<'PY'
          import json
          from pathlib import Path
          value=json.loads(Path('.generated/live-backend-qa/family4-runtime.json').read_text())
          pipes=[r for r in value.get('rows',[]) if str(r.get('id','')).startswith('SAN-PIPE-')]
          assert value['runtime_status']=='PUBLISHED_VALIDATED_PROFILE_BOQ',value.get('runtime_status')
          assert value['runtime_profile']=='family4-v8.19',value.get('runtime_profile')
          assert len(value['rows'])==27 and len(pipes)==8
          assert abs(sum(float(r['quantity']) for r in pipes)-92.5)<1e-6
          assert value['source_policy']['reference_used_for_generation'] is False
          assert all(max(r.get('source_pages') or [0])<=71 for r in value['rows'])
          assert all((r.get('evidence') or {}).get('exact_segment_evidence_status')=='PASS_EXACT_SOURCE_GEOMETRY_RECONCILED' for r in pipes),pipes
          print('AUTO_BOQ_HTTP_FAMILY4_PASS',{'rows':27,'pipe_rows':8,'pipe_total_m':92.5,'exact_geometry':True})
          PY

      - name: Verify modified Family4 cannot borrow validated profile and fails closed through generic inference
        run: |
          set -euo pipefail
          cp .generated/samples/family4.pdf .generated/samples/unregistered-family4-copy.pdf
          printf '\n%% profile-hash-must-change\n' >> .generated/samples/unregistered-family4-copy.pdf
          curl --fail-with-body --silent --show-error \
            -X POST -H 'Content-Type: application/pdf' -H 'X-File-Name: unregistered-family4-copy.pdf' \
            -H 'Origin: https://saratchai1.github.io' \
            --data-binary @.generated/samples/unregistered-family4-copy.pdf \
            http://127.0.0.1:8765/api/auto-boq > .generated/live-backend-qa/unregistered-runtime.json
          python - <<'PY'
          import json
          from pathlib import Path
          value=json.loads(Path('.generated/live-backend-qa/unregistered-runtime.json').read_text())
          assert value['runtime_status']=='WITHHELD_GENERIC_INFERENCE',value
          assert value['rows']==[],value['rows']
          assert value['source_policy']['reference_used_for_generation'] is False
          assert value['source_policy']['generic_profile_inference'] is True
          assert value['runtime_profile_sha256_gate'] is None
          print('AUTO_BOQ_HTTP_GENERIC_FAIL_CLOSED_PASS')
          PY

      - name: Stop HTTP runtime
        if: always()
        run: |
          if [ -f .generated/live-backend-qa/server.pid ]; then kill "$(cat .generated/live-backend-qa/server.pid)" 2>/dev/null || true; fi

      - name: Retain HTTP backend evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automatic-boq-live-backend-qa
          path: .generated/live-backend-qa/
          if-no-files-found: warn
          retention-days: 30
