name: Automatic BOQ evidence CI

on:
  push:
    branches:
      - feat/auto-boq-v8-pipe-network
    paths:
      - 'integrations/opentakeoff/**'
      - '.github/workflows/automatic-boq-ci.yml'
  pull_request:
    paths:
      - 'integrations/opentakeoff/**'
      - 'web/opentakeoff-poc/**'
      - '.github/workflows/automatic-boq-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  family4-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: integrations/opentakeoff/requirements-auto-boq.txt
      - name: Install pinned PDF geometry dependencies
        run: python -m pip install --disable-pip-version-check -r integrations/opentakeoff/requirements-auto-boq.txt
      - name: Fetch verified Family4 benchmark PDF
        run: python integrations/opentakeoff/fetch_sample.py --output .generated/samples/family4.pdf
      - name: Render source pipe pages for reconciliation QA
        run: >-
          python integrations/opentakeoff/render_pipe_debug_v8.py
          --pdf .generated/samples/family4.pdf
          --profile integrations/opentakeoff/profiles/family4.json
          --output-dir .generated/pipe-pages
      - name: Render semantic CAD pipe layers for classification QA
        run: >-
          python integrations/opentakeoff/render_pipe_layers_v8.py
          --pdf .generated/samples/family4.pdf
          --profile integrations/opentakeoff/profiles/family4.json
          --output-dir .generated/pipe-layers
      - name: Run v8 topology and parser unit tests
        working-directory: integrations/opentakeoff
        run: |
          python test_auto_boq_v8.py
          python test_pipe_reconcile_v8.py
          python test_fixture_schedule_v8.py
      - name: Generate v8 Automatic BOQ without reference access
        run: >-
          python integrations/opentakeoff/auto_boq_v8.py
          --pdf .generated/samples/family4.pdf
          --profile integrations/opentakeoff/profiles/family4.json
          --output .generated/auto-boq.json
      - name: Generate v8.1 diameter reconciliation diagnostics
        run: >-
          python integrations/opentakeoff/auto_boq_v8_1.py
          --pdf .generated/samples/family4.pdf
          --profile integrations/opentakeoff/profiles/family4.json
          --output .generated/auto-boq-v8-1.json
      - name: Probe same-layer component gaps before enabling bridges
        run: >-
          python integrations/opentakeoff/probe_pipe_gaps_v8.py
          --pdf .generated/samples/family4.pdf
          --profile integrations/opentakeoff/profiles/family4.json
          --output .generated/pipe-gap-probe-v8.json
      - name: Re-run leak fence and existing detector regression tests
        run: >-
          python integrations/opentakeoff/test_auto_boq.py
          --pdf .generated/samples/family4.pdf
          --profile integrations/opentakeoff/profiles/family4.json
          --reference integrations/opentakeoff/benchmark_reference.json
      - name: Score only after generation is complete
        run: >-
          python integrations/opentakeoff/score_auto_boq.py
          --generated .generated/auto-boq.json
          --reference integrations/opentakeoff/benchmark_reference.json
          --output .generated/auto-boq-benchmark.json
      - name: Assert v8 source-policy and withholding invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path('.generated/auto-boq.json').read_text())
          bench = json.loads(Path('.generated/auto-boq-benchmark.json').read_text())
          assert result['source_policy']['reference_used_for_generation'] is False
          assert all(max(row['source_pages']) <= 71 for row in result['rows'])
          assert len(result['rows']) == 19
          assert bench['reference_rows'] == 20
          assert bench['detected_reference_rows'] == 19
          assert bench['coverage_pct'] >= 95.0
          assert bench['detected_rows_accuracy_pct'] == 100.0
          assert bench['mean_absolute_error_pct'] < 0.15

          diag = next(d for d in result['diagnostics'] if d.get('detector') == 'sanitary_pipe_network_v8')
          assert diag['status'] == 'DIAGNOSTIC_ONLY_NO_QUANTITY'
          assert diag['systems'] == ['CW', 'W', 'SW', 'S', 'V', 'RL']
          pages = diag['pages']
          assert [p['page'] for p in pages] == [57, 58, 59, 60]
          assert [p['sheet'] for p in pages] == ['SN-04', 'SN-05', 'SN-06', 'SN-07']
          assert [p['effective_scale_candidates'] for p in pages] == [[50], [100], [100], [50]]
          assert [p['view_role'] for p in pages] == [
              'vertical_schematic', 'ground_floor_plan', 'upper_floor_plan', 'enlarged_bathroom_details'
          ]
          assert 'never be summed' in diag['non_additive_rule']
          assert not any(row['id'].startswith('SAN-PIPE-') for row in result['rows'])
          for page in pages:
              for component in page['candidate_components']:
                  assert component['publication_status'] == 'WITHHELD_DIAGNOSTIC_ONLY'
          fd = next(d for d in result['diagnostics'] if d.get('detector') == 'positioned_tag_diagnostic:SAN-FLOOR-DRAIN-2')
          assert fd['detections'] == 4 and fd['status'] == 'WITHHELD_DIAGNOSTIC_ONLY'
          print('V8_FAMILY4_EVIDENCE_PASS', {
              'pipe_tags': sum(p['tag_count'] for p in pages),
              'pipe_candidate_components': sum(len(p['candidate_components']) for p in pages),
              'published_pipe_rows': 0,
              'coverage_pct': bench['coverage_pct'],
          })
          PY
      - name: Assert v8.1 schedule and non-additive reconciliation contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path('.generated/auto-boq-v8-1.json').read_text())
          assert result['source_policy']['reference_used_for_generation'] is False
          assert not any(row['id'].startswith('SAN-PIPE-') for row in result['rows'])
          diag = next(d for d in result['diagnostics'] if d.get('detector') == 'sanitary_pipe_network_v8_1')
          assert diag['status'] == 'DIAGNOSTIC_HORIZONTAL_CANDIDATES_NO_PUBLISHED_PIPE_ROWS'
          pages = diag['pages']
          assert [p['page'] for p in pages] == [57, 58, 59, 60]
          assert all('diameter_coverage' in p and 'diameter_rows' in p for p in pages)

          schedule = diag['fixture_branch_schedule']
          assert schedule['page'] == 60 and schedule['sheet'] == 'SN-07'
          assert schedule['status'] == 'PARSED', schedule
          assert schedule['connection_count'] == 18, schedule
          expected = {
              ('WC','CW'):'DN15', ('WC','S'):'DN100', ('WC','V'):'DN50',
              ('WC1','CW'):'DN25', ('WC1','S'):'DN100', ('WC1','V'):'DN50',
              ('LAV','CW'):'DN15', ('LAV','V'):'DN40', ('LAV','W'):'DN50',
              ('UR','CW'):'DN20', ('UR','S'):'DN50', ('UR','V'):'DN40',
              ('SH','CW'):'DN15', ('C','CW'):'DN15',
              ('SINK','CW'):'DN15', ('SINK','V'):'DN40', ('SINK','W'):'DN50',
              ('FD','W'):'DN50',
          }
          got = {(r['fixture'],r['system']):r['diameter_key'] for r in schedule['rows']}
          assert got == expected, got
          assert schedule['publication_policy'] == 'EVIDENCE_ONLY_NO_PIPE_LENGTH_ADDITION'

          probes = diag['detail_view_reconciliation']
          assert {p['id'] for p in probes} == {'BATHROOM-1','BATHROOM-2','BATHROOM-3'}
          rec = diag['reconciliation']
          assert rec['primary_pages'] == [58, 59]
          assert rec['cross_view_policy_status'] == 'PASS_NON_ADDITIVE_BY_VIEW_ROLE'
          assert rec['full_pipe_boq_publication_status'] == 'WITHHELD_VERTICAL_AND_DETAIL_RECONCILIATION'
          excluded = {row['sheet']: row['reason'] for row in rec['excluded_non_additive_views']}
          assert excluded['SN-04'] == 'VERTICAL_SCHEMATIC_EVIDENCE_ONLY'
          assert excluded['SN-07'] == 'DETAIL_OVERLAY_EVIDENCE_ONLY'
          assert all(float(p['diameter_coverage']['total_length_pt']) > 0 for p in pages if p['page'] in (58, 59))
          print('V8_1_FAMILY4_RECONCILIATION_PASS', {
              'schedule_connections': schedule['connection_count'],
              'detail_probes': {
                  p['id']: {
                      'status': p['status'],
                      'score': p['match'].get('match_score'),
                      'candidates': p.get('candidate_count',0),
                      'ambiguous': p.get('ambiguous_count',0),
                      'unmatched': p.get('unmatched_count',0),
                  }
                  for p in probes
              },
              'primary_coverage': {p['sheet']: p['diameter_coverage']['assigned_fraction'] for p in pages if p['page'] in (58, 59)},
              'horizontal_gate': rec['horizontal_diameter_gate'],
              'horizontal_candidate_rows': len(rec['horizontal_primary_rows']),
              'published_pipe_rows': 0,
          })
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: automatic-boq-v8-evidence
          path: |
            .generated/auto-boq.json
            .generated/auto-boq-v8-1.json
            .generated/pipe-gap-probe-v8.json
            .generated/auto-boq-benchmark.json
            .generated/pipe-pages/
            .generated/pipe-layers/
          if-no-files-found: warn
          retention-days: 30
