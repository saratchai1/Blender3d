name: Automatic BOQ v8.8 collinear gap CI

on:
  push:
    branches:
      - feat/auto-boq-v8-pipe-network
    paths:
      - 'integrations/opentakeoff/auto_boq_v8_8.py'
      - 'integrations/opentakeoff/collinear_gap_bridge_v8.py'
      - 'integrations/opentakeoff/test_collinear_gap_bridge_v8.py'
      - 'integrations/opentakeoff/auto_boq_v8_7.py'
      - 'integrations/opentakeoff/auto_boq_v8_6.py'
      - 'integrations/opentakeoff/detail_short_branch_v8.py'
      - 'integrations/opentakeoff/strict_pipe_tags_v8.py'
      - 'integrations/opentakeoff/layer_topology_v8.py'
      - 'integrations/opentakeoff/auto_boq_v8_3.py'
      - 'integrations/opentakeoff/detail_view_transfer_v8.py'
      - 'integrations/opentakeoff/leader_association_v8.py'
      - 'integrations/opentakeoff/profiles/family4.json'
      - 'integrations/opentakeoff/fetch_sample.py'
      - 'integrations/opentakeoff/requirements-auto-boq.txt'
      - '.github/workflows/automatic-boq-v8-8-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  family4-v8-8:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: integrations/opentakeoff/requirements-auto-boq.txt
      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check -r integrations/opentakeoff/requirements-auto-boq.txt
      - name: Run collinear gap bridge regression
        working-directory: integrations/opentakeoff
        run: |
          python test_collinear_gap_bridge_v8.py
          python test_detail_short_branch_v8.py
          python test_strict_pipe_tags_v8.py
      - name: Fetch exact Family4 source PDF
        run: python integrations/opentakeoff/fetch_sample.py --output .generated/samples/family4.pdf
      - name: Generate v8.7 control
        run: >-
          python integrations/opentakeoff/auto_boq_v8_7.py
          --pdf .generated/samples/family4.pdf
          --profile integrations/opentakeoff/profiles/family4.json
          --output .generated/v8-7-control.json
      - name: Generate v8.8 collinear-gap diagnostic
        run: >-
          python integrations/opentakeoff/auto_boq_v8_8.py
          --pdf .generated/samples/family4.pdf
          --profile integrations/opentakeoff/profiles/family4.json
          --output .generated/v8-8.json
      - name: Assert constrained improvement and no publication regression
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('.generated/v8-7-control.json').read_text()); n=json.loads(Path('.generated/v8-8.json').read_text())
          assert c['source_policy']['reference_used_for_generation'] is False and n['source_policy']['reference_used_for_generation'] is False
          assert len(c['rows'])==len(n['rows'])==19
          assert not any(str(r.get('id','')).startswith('SAN-PIPE-') for r in n['rows'])
          dc=next(d for d in c['diagnostics'] if d.get('detector')=='sanitary_pipe_network_v8_7'); dn=next(d for d in n['diagnostics'] if d.get('detector')=='sanitary_pipe_network_v8_8')
          cp={p['sheet']:p['diameter_coverage']['assigned_fraction'] for p in dc['pages'] if p.get('contribution_policy')=='PRIMARY_PLAN_HORIZONTAL'}
          np={p['sheet']:p['diameter_coverage']['assigned_fraction'] for p in dn['pages'] if p.get('contribution_policy')=='PRIMARY_PLAN_HORIZONTAL'}
          assert all(np[k]>=cp[k] for k in cp),(cp,np)
          bridge=dn['collinear_gap_bridge']
          assert bridge['endpoint_to_endpoint_only'] is True
          assert bridge['gap_length_added'] is False
          assert bridge['accepted_seed_count']>=1,bridge
          assert bridge['accepted_component_length_pt']>0,bridge
          for e in bridge['accepted_events']:
              assert e['bridge_gap_pt']<=9.0,e
              assert e['bridge_angle_diff_deg']<=5.0,e
              assert e['evidence_role']=='DIAMETER_SEED_ONLY_NO_GAP_LENGTH',e
          for g in bridge['withheld_conflicting_groups']:
              assert len(g['classes'])>1,g
          assert dn['reconciliation']['cross_view_policy_status']=='PASS_NON_ADDITIVE_BY_VIEW_ROLE'
          assert dn['reconciliation']['full_pipe_boq_publication_status'].startswith('WITHHELD_')
          print('AUTO_BOQ_V8_8_AB_PASS',{'control':cp,'bridged':np,'bridge_seeds':bridge['accepted_seed_count'],'bridge_length_pt':bridge['accepted_component_length_pt'],'conflicting_groups':bridge['conflicting_group_count'],'pipe_rows':0})
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: automatic-boq-v8-8-evidence
          path: |
            .generated/v8-7-control.json
            .generated/v8-8.json
          if-no-files-found: warn
          retention-days: 30
