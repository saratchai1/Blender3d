name: Automatic BOQ v8.13 vertical level CI

on:
  push:
    branches:
      - feat/auto-boq-v8-pipe-network
    paths:
      - 'integrations/opentakeoff/auto_boq_v8_13.py'
      - 'integrations/opentakeoff/vertical_level_bounds_v8.py'
      - 'integrations/opentakeoff/test_vertical_level_bounds_v8.py'
      - 'integrations/opentakeoff/auto_boq_v8_12.py'
      - 'integrations/opentakeoff/vertical_schematic_v8.py'
      - 'integrations/opentakeoff/test_vertical_schematic_v8.py'
      - 'integrations/opentakeoff/auto_boq_v8_11.py'
      - 'integrations/opentakeoff/cross_view_system_consensus_v8.py'
      - 'integrations/opentakeoff/profiles/family4.json'
      - 'integrations/opentakeoff/fetch_sample.py'
      - 'integrations/opentakeoff/requirements-auto-boq.txt'
      - '.github/workflows/automatic-boq-v8-13-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  family4-v8-13:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: integrations/opentakeoff/requirements-auto-boq.txt
      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check -r integrations/opentakeoff/requirements-auto-boq.txt
      - name: Run vertical level and upstream regressions
        working-directory: integrations/opentakeoff
        run: |
          python test_vertical_level_bounds_v8.py
          python test_vertical_schematic_v8.py
          python test_cross_view_system_consensus_v8.py
          python test_strict_pipe_tags_v8.py
      - name: Fetch exact Family4 source PDF
        run: python integrations/opentakeoff/fetch_sample.py --output .generated/samples/family4.pdf
      - name: Generate v8.12 control
        run: >-
          python integrations/opentakeoff/auto_boq_v8_12.py
          --pdf .generated/samples/family4.pdf
          --profile integrations/opentakeoff/profiles/family4.json
          --output .generated/v8-12-control.json
      - name: Generate v8.13 level-bounded vertical diagnostic
        run: >-
          python integrations/opentakeoff/auto_boq_v8_13.py
          --pdf .generated/samples/family4.pdf
          --profile integrations/opentakeoff/profiles/family4.json
          --output .generated/v8-13.json
      - name: Assert horizontal gate preserved and vertical stays non-publishing
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('.generated/v8-12-control.json').read_text())
          n=json.loads(Path('.generated/v8-13.json').read_text())
          assert c['source_policy']['reference_used_for_generation'] is False
          assert n['source_policy']['reference_used_for_generation'] is False
          assert len(c['rows'])==len(n['rows'])==19
          assert not any(str(r.get('id','')).startswith('SAN-PIPE-') for r in n['rows'])
          dc=next(d for d in c['diagnostics'] if d.get('detector')=='sanitary_pipe_network_v8_12')
          dn=next(d for d in n['diagnostics'] if d.get('detector')=='sanitary_pipe_network_v8_13')
          assert dc['reconciliation']['horizontal_diameter_gate']=='PASS'
          assert dn['reconciliation']['horizontal_diameter_gate']=='PASS'
          bounded=dn['vertical_level_bounded_reconciliation']
          assert bounded['status']=='LEVEL_BOUNDED_VERTICAL_CANDIDATES',bounded
          assert bounded['candidate_run_count']>=6,bounded
          assert bounded['withheld_run_count']>=1,bounded
          rows={(r['system'],r['diameter_key']):r for r in bounded['candidate_rows']}
          assert ('V','DN50') in rows and rows[('V','DN50')]['vertical_length_m_candidate']>=7.5,rows
          assert ('CW','DN20') in rows and rows[('CW','DN20')]['vertical_length_m_candidate']>=6.3,rows
          assert ('SW','DN100') in rows and rows[('SW','DN100')]['vertical_length_m_candidate']>=7.5,rows
          assert ('W','DN65') not in rows,rows
          terminal=[r for r in bounded['withheld_runs'] if r.get('system')=='V' and float(r.get('terminal_extension_above_m',0))>0]
          assert terminal, bounded
          assert bounded['publication_policy']=='DIAGNOSTIC_ONLY_NO_VERTICAL_PUBLICATION'
          assert dn['reconciliation']['full_pipe_boq_publication_status'].startswith('WITHHELD_')
          print('AUTO_BOQ_V8_13_VERTICAL_LEVEL_PASS',{
              'vertical_rows':{k:v['vertical_length_m_candidate'] for k,v in rows.items()},
              'candidate_runs':bounded['candidate_run_count'],
              'withheld_runs':bounded['withheld_run_count'],
              'pipe_rows':0,
          })
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: automatic-boq-v8-13-evidence
          path: |
            .generated/v8-12-control.json
            .generated/v8-13.json
          if-no-files-found: warn
          retention-days: 30
